/* ---------- v1.8 Bug Garden ---------- */
:root{--bug:#8DD46A;--bug-tint:#E4F6D4}
.themes.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.themes.five .room-card.theme{flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:11px 6px 8px}
.themes.five .room-card.theme .big{line-height:1.05}
.themes.five .room-card.theme .tx{align-items:center}
.themes.five .room-card.theme .big{font-size:clamp(30px,5.2vmin,48px)}
.themes.five .room-card.theme .name{font-size:clamp(16px,2.5vmin,23px);white-space:nowrap}
.themes.five .room-card.theme .sub{font-size:clamp(11px,1.6vmin,14px)}
@media (max-height:860px) and (orientation:landscape){.themes.five .room-card.theme .sub{display:none}}
.room-card.bug{background:linear-gradient(180deg,#C9EFA0 0%,#8DD46A 100%)}
.room[data-room=bug]{--room:var(--bug);--room-tint:var(--bug-tint)}
.buggy{background:linear-gradient(180deg,#F3FBEA 0%,#E2F5D0 82%,#CDEDB2 100%)}
.streak-banner.bug{background:var(--bug)}
.adv-stop.bug .thumb{background:var(--bug-tint)}
.arc-sec.bug{--sec:var(--bug)}

/* garden backdrop shared by the bug scenes */
.bugscene{position:relative;flex:1;min-height:0;width:min(100%,920px);display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vmin,30px);overflow:hidden;
  border-radius:24px;border:3px solid var(--ink);background:linear-gradient(180deg,#DDF3FB 0%,#EEF9FD 58%,#A6DE82 58%,#8DD46A 100%)}
.bugscene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;pointer-events:none;
  background:radial-gradient(circle 6px at 10% 40%,#FFD93D 96%,transparent),radial-gradient(circle 5px at 36% 70%,#F7A1C4 96%,transparent),radial-gradient(circle 6px at 64% 35%,#fff 96%,transparent),radial-gradient(circle 5px at 90% 60%,#B49BF5 96%,transparent)}
.bugscene>*{position:relative;z-index:1}
.bugscene .eqsign{position:absolute;z-index:4}

/* Ladybug Spots */
.lb{flex:none;display:block}
.lb svg{display:block;width:100%;height:100%;overflow:visible}
.lb-spot{cursor:pointer}
.lb-w{transform-box:view-box;transform-origin:120px 90px;transition:transform .3s ease}
.lb-new{animation:pop .4s ease}
.lb.fly{animation:lbhop 1.2s ease}
.lb.fly .lb-wl{animation:lbwl .22s ease-in-out 5 alternate}
.lb.fly .lb-wr{animation:lbwr .22s ease-in-out 5 alternate}
@keyframes lbwl{to{transform:rotate(-16deg)}}
@keyframes lbwr{to{transform:rotate(16deg)}}
@keyframes lbhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-34px) rotate(-4deg)}70%{transform:translateY(-20px) rotate(3deg)}}

/* Caterpillar ABCs */
.bugscene.grass{align-items:flex-end;padding-bottom:5%}
.cater{display:flex;align-items:flex-end}
.cater .seq.caterpillar{gap:0;flex-wrap:nowrap;align-items:flex-end}
.seq.caterpillar>span{position:relative;display:grid;place-items:center;width:1.45em;height:1.45em;min-width:0;padding:0;margin-left:-.16em;border-radius:50%;
  background:#8EDC6A;font-size:clamp(38px,9.6vmin,92px);line-height:1;animation:catbob 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.22s)}
.seq.caterpillar>span:nth-child(even){background:#6FCF5A}
.seq.caterpillar>span::after{content:"";position:absolute;bottom:-.2em;left:28%;width:44%;height:.2em;border-left:5px solid var(--ink);border-right:5px solid var(--ink);z-index:-1}
.seq.caterpillar>span.blank{background:rgba(255,255,255,.7);border-style:dashed}
.seq.caterpillar>span.grown{animation:pop .4s ease,catbob 1.8s ease-in-out infinite}
.seq.caterpillar.growing>span.blank{color:transparent}
.cat-tail{width:clamp(18px,3.6vmin,34px);height:clamp(18px,3.6vmin,34px);border-radius:50%;background:#6FCF5A;border:3px solid var(--ink);align-self:flex-end;margin-bottom:.3em;margin-right:-4px}
.cat-head{display:block;width:clamp(70px,15.5vmin,150px);margin-left:-.4em;align-self:flex-end;margin-bottom:.25em;animation:catbob 1.8s ease-in-out infinite;animation-delay:-1.2s}
.cat-head svg{display:block;width:100%;height:auto}
@keyframes catbob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.cater.wiggle{animation:catgo 1.6s ease-in-out}
@keyframes catgo{0%{transform:translateX(0)}40%{transform:translateX(5%) rotate(-1deg)}70%{transform:translateX(-2%) rotate(1deg)}100%{transform:translateX(0)}}
.ltile.leafy{background:var(--bug-tint);border-radius:28px 8px 28px 8px}

/* Butterfly Match */
.bfly{display:flex;align-items:center;justify-content:center}
.bf-wing,.bf-body{display:block;height:100%}
.bf-wing svg,.bf-body svg{display:block;height:100%;width:auto}
.bf-left{transform-origin:right center}
.bf-wing:last-child{transform-origin:left center}
.bf-body{margin:0 -3px;position:relative;z-index:2}
.bf-slot path:first-of-type{stroke-dasharray:10 9;stroke:rgba(29,42,68,.55)}
.bfly.flap{animation:bfup 1.6s ease}
.bfly.flap .bf-left,.bfly.flap .bf-wing:last-child{animation:bfflap .2s ease-in-out 6 alternate}
.bfly.flap .bf-wing:last-child{animation-name:bfflap,pop;animation-duration:.2s,.4s;animation-iteration-count:6,1}
@keyframes bfflap{to{transform:scaleX(.55)}}
@keyframes bfup{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.choice.wingc{padding:6px 8px;background:var(--paper)}
.choice.wingc svg{display:block;height:clamp(86px,16vmin,150px);width:auto}

/* Bee & Flowers */
.bee-wrap{display:flex;align-items:center;gap:clamp(8px,2.4vmin,24px)}
.bee{display:block;font-size:clamp(56px,11vmin,104px);line-height:1;animation:buzz 1.4s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(3px,-8px) rotate(4deg)}50%{transform:translate(-2px,-3px) rotate(-3deg)}75%{transform:translate(2px,-10px) rotate(5deg)}}
.frames.pollen .frame{background:#9A6234;border-color:#9A6234}
.frames.pollen .dotfill{background:#FFD93D}
.bee-flower svg{display:block;width:clamp(120px,24vmin,220px);height:auto}
.choice.flowerc{padding:6px;background:var(--bug-tint);border-radius:50%}
.choice.flowerc svg{display:block;width:clamp(86px,15vmin,140px);height:auto}

/* Butterfly Painter */
.bfp-cv{display:block;background:#E8F7FC;border:3px solid var(--ink);border-radius:20px;touch-action:none;cursor:crosshair}
.bfp-holder.flutter .bfp-cv{animation:bfpfly 1.3s ease-in-out}
@keyframes bfpfly{0%,100%{transform:translateY(0) scaleX(1)}20%{transform:translateY(-14px) scaleX(.8)}40%{transform:translateY(-24px) scaleX(1)}60%{transform:translateY(-30px) scaleX(.8)}80%{transform:translateY(-16px) scaleX(1)}}

@media (max-width:640px){
  .themes.five{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .themes.five>.room-card{grid-column:span 2}
  .themes.five>.room-card:nth-child(4){grid-column:2 / span 2}
  .themes.five .room-card.theme .sub{display:none}
  .themes.five .room-card.theme .name{white-space:normal;font-size:15px;line-height:1.1}
}
@media (orientation:portrait) and (min-width:641px){
  .themes.five{grid-template-columns:repeat(6,minmax(0,1fr))}
  .themes.five>.room-card{grid-column:span 2}
  .themes.five>.room-card:nth-child(4){grid-column:2 / span 2}
}

/* ---------- v1.9 Winter Wonderland ---------- */
:root{--snow:#7FC4F0;--snow-tint:#E2F2FF;--flakes:radial-gradient(circle 2.6px at 14px 22px,#fff 96%,transparent),radial-gradient(circle 2px at 76px 58px,#fff 96%,transparent),radial-gradient(circle 3px at 112px 12px,#fff 96%,transparent),radial-gradient(circle 1.8px at 44px 104px,#fff 96%,transparent),radial-gradient(circle 2.4px at 98px 126px,#fff 96%,transparent)}
.themes.six{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.themes.six .room-card.theme{flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:11px 4px 8px}
.themes.six .room-card.theme .tx{align-items:center}
.themes.six .room-card.theme .big{font-size:clamp(28px,4.8vmin,44px);line-height:1.05}
.themes.six .room-card.theme .name{font-size:clamp(14px,2.2vmin,20px);line-height:1.1}
.themes.six .room-card.theme .sub{display:none}
.themes.five .room-card.snow .name,.themes.six .room-card.snow .name{letter-spacing:-.02em}
.room-card.snow{background:var(--flakes),linear-gradient(180deg,#E8F5FF 0%,#A9D6F5 100%);background-size:140px 140px,auto}
.room[data-room=snow]{--room:var(--snow);--room-tint:var(--snow-tint)}
.snowy{background:var(--flakes),linear-gradient(180deg,#E3F2FD 0%,#F3F9FF 100%);background-size:140px 140px,auto}
.snowy .tile .thumb{background:var(--snow-tint)}
.streak-banner.snow{background:var(--snow)}
.adv-stop.snow .thumb{background:var(--snow-tint)}
.arc-sec.snow{--sec:var(--snow)}

/* snowy backdrop shared by the winter scenes, with gently falling snow */
.winterscene{position:relative;flex:1;min-height:0;width:min(100%,920px);display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vmin,36px);overflow:hidden;
  border-radius:24px;border:3px solid var(--ink);background:linear-gradient(180deg,#BFE1F7 0%,#E6F4FD 60%,#FFFFFF 60%,#EEF6FD 100%)}
.winterscene::before{content:"";position:absolute;left:0;right:0;top:-140px;height:calc(100% + 140px);background:var(--flakes);background-size:140px 140px;opacity:.9;pointer-events:none;animation:snowfall 7s linear infinite}
@keyframes snowfall{to{transform:translateY(140px)}}
.winterscene>*{position:relative;z-index:1}
.winterscene .eqsign{position:absolute;z-index:4}

/* Jingle Bell Syllables */
.bell-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:10px 26px 12px;box-shadow:0 5px 0 var(--ink)}
.bell-pic{font-size:clamp(68px,15vmin,140px);line-height:1.05;background:none;border:0;padding:0;cursor:pointer}
.syl-word{display:flex;align-items:baseline;font-family:var(--f-print);font-weight:700;font-size:clamp(30px,6.2vmin,58px);line-height:1.15}
.syl{display:inline-block}
.syl-dot{display:none;color:#E8454A;margin:0 .14em}
.syl-word.split .syl-dot{display:inline}
.syl.ring{color:#E8454A;animation:sylpop .42s ease}
@keyframes sylpop{50%{transform:translateY(-12px) scale(1.15)}}
.clap-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.clap-bell{position:relative;width:clamp(86px,15vmin,130px);height:clamp(86px,15vmin,130px);border-radius:50%;background:#FFE9A8;display:grid;place-items:center;font-size:clamp(46px,8vmin,70px);padding:0}
.clap-bell.ding .emoji{display:inline-block;animation:bellring .45s ease}
@keyframes bellring{20%{transform:rotate(-16deg)}40%{transform:rotate(13deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
.clap-n{position:absolute;top:-8px;right:-8px;min-width:36px;height:36px;padding:0 6px;border-radius:999px;background:var(--berry);border:3px solid var(--ink);font-family:var(--f-display);font-weight:900;font-size:21px;display:grid;place-items:center}
.clap-n:empty{display:none}
.clap-tip{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,2.2vmin,18px);color:var(--ink-soft);text-align:center;max-width:9em}
.bell-row{display:flex;gap:6px;font-size:clamp(44px,9vmin,84px);line-height:1.1}
.bell-cap{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4.4vmin,40px)}
.syl-slot{min-height:1.2em;font-size:clamp(30px,6vmin,56px)}
.choice.bellc{gap:4px;padding:8px 12px}
.bellset{display:flex;gap:2px;font-size:clamp(26px,4.6vmin,42px);line-height:1.1}
.bellset[data-n="4"]{display:grid;grid-template-columns:repeat(2,auto)}
.bell-num{font-family:var(--f-print);font-weight:700;font-size:clamp(26px,4.6vmin,40px);line-height:1}

/* Snowball Toss */
.sb-scene{align-items:flex-end}
.winterscene .wdeco{position:absolute;z-index:0;bottom:38%;line-height:1;font-size:clamp(40px,9vmin,84px);pointer-events:none}
.winterscene .wdeco.d1{left:5%}.winterscene .wdeco.d2{left:13%;font-size:clamp(30px,6.5vmin,60px)}.winterscene .wdeco.d3{right:7%}.winterscene .wdeco.d4{right:16%;font-size:clamp(34px,7vmin,64px);bottom:30%}
.sb-pile{width:clamp(90px,16vmin,150px);margin-bottom:3%}
.sb-pile svg{display:block;width:100%}
.choice.snowc{padding:4px 6px 0;background:#EAF6FF;border-radius:22px}
.choice.snowc .sm-sign{display:block;height:clamp(150px,30vmin,262px);width:auto}
.sm-splat{opacity:0}
.sm-hat{transform-box:view-box;transform-origin:80px 40px}
.choice.snowc.hit .sm-splat{opacity:1}
.choice.snowc.hit .sm-hat{animation:hatoff .9s ease forwards}
@keyframes hatoff{40%{transform:translate(12px,-44px) rotate(20deg)}100%{transform:translate(22px,-26px) rotate(34deg)}}
.sb-ball{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:inset -5px -5px 0 #D6E6F5}

/* Cocoa Count */
.trays{display:flex;gap:clamp(8px,2vmin,20px);flex-wrap:wrap;justify-content:center}
.trays.two .tray{--c:clamp(34px,7.4vmin,66px)}
.cafe{align-items:flex-end;padding-bottom:4%}
.tray{--c:clamp(40px,10vmin,90px);display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);gap:4px;padding:8px;background:#C98B55;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink)}
.tcell{background:#8A5A33;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(0,0,0,.2)}
.mallow{width:78%;height:78%;background:#fff;border:3px solid var(--ink);border-radius:30%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:calc(var(--c) * .36);color:var(--ink);cursor:pointer;box-shadow:inset -4px -4px 0 #EDE3F4}
.mallow[data-n]{background:#FFE3EF}
.mallow.new{animation:mallowin .45s ease both}
@keyframes mallowin{0%{transform:translateY(-40px) scale(.4);opacity:0}70%{transform:translateY(4px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
.mug{width:clamp(86px,19vmin,170px);flex:none}
.mug svg{display:block;width:100%}
.mug-steam path{transform-box:fill-box}
.mug.yum{animation:pop .5s ease}
.mug.yum .mug-steam path{animation:steam 1.1s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-7px)}}

/* Light the Tree */
.xtree-wrap{flex:none}
.xtree-wrap svg{display:block;width:100%;height:100%}
.xtree .bulb{opacity:.5}
.xtree .tslot{transform-box:fill-box;transform-origin:center}
.xtree .tslot.on{animation:pop .4s ease}
.xtree-wrap.lit .bulb{opacity:1;animation:bulbblink .9s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bulbblink{50%{opacity:.35}}
.xtree-wrap.lit .tstar{fill:#FFD93D;animation:starshine 1.2s ease-in-out infinite}
@keyframes starshine{50%{filter:drop-shadow(0 0 10px #FFE27A)}}
.orn{position:relative;width:clamp(70px,12vmin,104px);height:clamp(70px,12vmin,104px);margin-top:14px;padding:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,transparent 11%),var(--oc)}
.orn::before{content:"";position:absolute;top:-14px;left:50%;width:28%;height:16px;transform:translateX(-50%);background:#D9C27A;border:3px solid var(--ink);border-radius:5px}
.orn-n{font-family:var(--f-print);font-weight:700;font-size:clamp(28px,5.6vmin,48px);line-height:1.15;color:var(--ink);background:rgba(255,255,255,.88);border-radius:999px;padding:0 .2em}
.orn.used{visibility:hidden}
.orn.nope{animation:shake .4s ease}
.orn.hint{animation:glow 1.1s ease-in-out infinite}

/* Snowman Maker */
.sn-wrap{position:relative;border-radius:24px;padding:6px;background:linear-gradient(180deg,#D8EDFC,#F4FAFF)}
.sn-holder .sn-svg{display:block;height:100%;width:auto;max-width:100%;max-height:100%}
.sn-opt .sn-svg{display:block;width:100%;height:auto;max-height:110px}
.sn-holder{position:relative;border-radius:20px;transition:background-color .4s}
.sn-holder.snowing{background:#B9DBF5}
.sn-holder.snowing::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;background:var(--flakes);background-size:140px 140px;animation:snowdrift 4s linear infinite;filter:drop-shadow(0 0 1px #9FC4E4)}
@keyframes snowdrift{to{background-position:0 140px}}
.gal-item.sm-item{background:#D6ECFB}
.gal-item .sn-svg{display:block;width:100%;height:auto}

/* Snowflake Cutter */
.sf-holder{min-width:0}
.sf-pair{display:flex;align-items:center;gap:10px}
.sf-wedge,.sf-flake{display:block;border:3px solid var(--ink);border-radius:16px;touch-action:none}
.sf-wedge{cursor:crosshair}
.sf-arrow{font-size:clamp(20px,4vmin,34px);color:var(--ink-soft)}
.sf-flake.spin{animation:sfspin 1.2s ease}
@keyframes sfspin{to{transform:rotate(360deg)}}
.sf-pal{grid-template-columns:repeat(5,auto)}

/* Tree Lights */
.tl-box{position:relative;flex:1;min-height:0;width:min(100%,920px);display:flex;align-items:center;justify-content:center;border-radius:24px;border:3px solid var(--ink);background:radial-gradient(circle at 50% 38%,#2D4482,#121C40 78%);overflow:hidden}
.tl-tree{position:relative;flex:none}
.tl-tree svg{display:block;width:100%;height:100%}
.tl-bulb{position:absolute;transform:translate(-50%,-50%);width:21%;height:24%;padding:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.7) 0 9%,transparent 10%),var(--bc);border:4px solid var(--ink);filter:brightness(.5) saturate(.75);transition:filter .1s,box-shadow .1s;cursor:pointer}
.tl-box.yours .tl-bulb{filter:brightness(.78)}
.tl-bulb.on{filter:none!important;box-shadow:0 0 0 6px rgba(255,255,255,.35),0 0 44px 16px var(--bc)}
.tl-cap{position:absolute;top:-17%;left:50%;width:34%;height:20%;transform:translateX(-50%);background:#C9B98A;border:3px solid var(--ink);border-radius:4px}
.tl-bulb.nope{animation:tlshake .4s ease}
@keyframes tlshake{25%{transform:translate(-58%,-50%)}75%{transform:translate(-42%,-50%)}}
.tl-tree.glow .tl-star{fill:#FFD93D;animation:starshine 1s ease}
.tl-hearts{position:absolute;top:10px;left:14px;font-size:clamp(22px,4vmin,30px);display:flex;gap:4px}
.tl-hearts .gone{opacity:.25;filter:grayscale(1)}
.tl-msg{position:absolute;top:10px;right:16px;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,4vmin,34px);color:#fff;text-shadow:0 2px 0 var(--ink)}

@media (max-width:640px){
  .themes.six{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .themes.six .room-card.theme .name{font-size:15px}
  .sf-pair{gap:4px}
  .sf-arrow{display:none}
}
@media (orientation:portrait) and (min-width:641px){
  .themes.six{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- v1.10 sticker book pages ---------- */
.stk-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:1000px;margin:0 auto}
.stk-top{display:flex;align-items:center;gap:12px;width:100%}
.stk-arrow{flex:none;width:clamp(54px,9vmin,72px);height:clamp(54px,9vmin,72px);border-radius:50%;display:grid;place-items:center;padding:0;background:var(--math)}
.stk-arrow .ico{width:58%;height:58%;stroke-width:3.6}
#stk-next .ico{transform:scaleX(-1)}
.stk-arrow:disabled{opacity:.3;box-shadow:none;transform:translateY(4px)}
.stk-head{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.stk-title{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(22px,4.4vmin,36px);line-height:1.1}
.stk-count{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,2.5vmin,19px);color:var(--ink-soft)}
.stk-page{flex:1;min-height:0;width:100%;display:grid;justify-content:center;align-content:center;gap:14px;padding:16px;background:var(--pg,#FFF3D6);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);touch-action:pan-y;overflow:hidden}
.stk-page.full{background:radial-gradient(circle 3px at 20px 20px,rgba(255,196,63,.5) 96%,transparent) 0 0/40px 40px,var(--pg,#FFF3D6)}
.stk-page.turn-r{animation:pgturn-r .35s ease}
.stk-page.turn-l{animation:pgturn-l .35s ease}
@keyframes pgturn-r{0%{transform:translateX(40px);opacity:.3}100%{transform:none;opacity:1}}
@keyframes pgturn-l{0%{transform:translateX(-40px);opacity:.3}100%{transform:none;opacity:1}}
.stk-page .stk-disc{position:relative;width:var(--d,96px);height:var(--d,96px);aspect-ratio:auto;font-size:calc(var(--d,96px) * .56);padding:0}
.stk-page .stk-disc .emoji{line-height:1}
.stk-page .stk-disc.boing{animation:pop .4s ease}
.stk-page .stk-disc.locked{background:rgba(255,255,255,.55);border-style:dashed;box-shadow:none;color:inherit}
.stk-page .stk-disc.locked .emoji{filter:brightness(0);opacity:.13}
.stk-page .stk-disc.next{border-style:solid;background:rgba(255,255,255,.85);animation:glow 1.8s ease-in-out infinite}
.stk-need{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:2px;padding:0 8px;border-radius:999px;background:var(--paper);border:2.5px solid var(--ink);font-family:var(--f-display);font-weight:900;font-size:clamp(14px,2.4vmin,18px);white-space:nowrap}
.stk-need .star-ico{width:1.1em;height:1.1em}
.stk-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:100%;padding-bottom:2px}
.stk-dot{width:20px;height:20px;padding:0;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);transition:transform .15s}
.stk-dot.done{background:#FFC43F}
.stk-dot.on{transform:scale(1.35);background:var(--berry)}
.stickers .note{font-size:clamp(16px,2.6vmin,20px)}
.extra.stk{position:relative}
.extra.stk.has-new::after{content:"New!";position:absolute;top:-12px;right:-8px;padding:1px 10px;border-radius:999px;background:#FFD93D;border:3px solid var(--ink);font-family:var(--f-display);font-weight:900;font-size:16px;transform:rotate(8deg);animation:pop 1.6s ease-in-out infinite}

/* ---------- v1.11 Toddler Corner ---------- */
.tod,.tgame{background:radial-gradient(circle 5px at 20px 20px,rgba(255,255,255,.7) 96%,transparent) 0 0/48px 48px,linear-gradient(180deg,#FFF0F6 0%,#FFF8E6 100%)}
.tod-top{display:flex;align-items:center;gap:14px;min-height:64px}
.tod-top h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(22px,4vmin,32px)}
.tod-exit{position:relative;flex:none;width:64px;height:64px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;touch-action:none}
.tod-exit .ico{width:30px;height:30px}
.tod-ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none}
.tod-ring circle{fill:none;stroke:var(--berry);stroke-width:7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .15s}
.tod-exit.holding .tod-ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 1.2s linear}
.tod-hint{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:#fff;border-radius:12px;padding:5px 12px;font-family:var(--f-display);font-weight:800;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.tod-exit.hint .tod-hint{opacity:1}
.tod-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(12px,2.6vmin,24px);width:100%;max-width:1120px;margin:0 auto;padding:4px 4px 12px}
.tod-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;border-radius:32px;background:var(--tc)}
.tod-ic{font-size:clamp(56px,13vmin,124px);line-height:1.05}
.tod-name{font-family:var(--f-display);font-weight:900;font-size:clamp(17px,2.9vmin,25px);text-align:center;padding:0 6px}
.tod-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tod-area .mini-cv{border-radius:28px}

/* Peekaboo Barn */
.tb-wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;border:3px solid var(--ink);border-radius:28px;background:radial-gradient(circle at 88% 16%,#FFE27A 0 7%,rgba(255,226,122,.35) 7.2% 10%,transparent 10.2%),radial-gradient(ellipse 9% 5% at 20% 18%,#fff 96%,transparent),radial-gradient(ellipse 7% 4.5% at 26% 15%,#fff 96%,transparent),radial-gradient(ellipse 8% 4% at 58% 26%,#fff 96%,transparent),linear-gradient(180deg,#BDE5F2 0%,#E6F6FC 60%,#8FD16A 60%,#6FBF52 100%)}
.tb-scene{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:space-around;gap:2%;padding:0 3% 5%}
.tb-spot{position:relative;width:31%;max-width:370px;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
.tb-cover{position:relative;z-index:2;display:block;width:100%;pointer-events:none}
.tb-cover svg{display:block;width:100%;height:auto}
.tb-critter{position:absolute;z-index:1;left:50%;bottom:40%;font-size:clamp(70px,17vmin,150px);line-height:1;opacity:0;transform:translate(-50%,40%) scale(.4);transition:transform .38s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none}
.tb-spot.up .tb-critter{opacity:1;transform:translate(-50%,-48%) scale(1)}
.tb-barn .tb-critter{z-index:3;bottom:3%;transform:translate(-50%,0) scale(.2)}
.tb-spot.tb-barn.up .tb-critter{transform:translate(-50%,0) scale(1)}
.tb-barn .door-l,.tb-barn .door-r{transform-box:fill-box;transition:transform .3s ease}
.tb-barn .door-l{transform-origin:left center}.tb-barn .door-r{transform-origin:right center}
.tb-barn.up .door-l,.tb-barn.up .door-r{transform:scaleX(.12)}
.tb-spot.wig{animation:shake .4s ease}
.tb-spot.yay .tb-critter{animation:tbjump .5s ease 3}
@keyframes tbjump{50%{translate:0 -18%}}
.tb-ask{position:absolute;z-index:6;top:4%;left:50%;transform:translateX(-50%);font-size:clamp(46px,10vmin,86px);line-height:1.2;background:var(--paper);border:4px solid var(--ink);border-radius:999px;padding:0 26px;box-shadow:0 6px 0 var(--ink);animation:pop 1.2s ease-in-out infinite}
.tb-ask[hidden]{display:none}

/* Shape Sorter */
.ts-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:3vmin;padding:3vmin;overflow:hidden;background:var(--tc);border:3px solid var(--ink);border-radius:28px}
.ts-box{display:flex;flex-wrap:wrap;justify-content:center;gap:3vmin;padding:3vmin 4vmin;background:#C98B55;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink)}
.ts-box.shake{animation:shake .6s ease 2}
.ts-hole,.ts-piece{width:clamp(84px,17vmin,170px);height:clamp(84px,17vmin,170px)}
.ts-hole{border-radius:22px;background:#B57B48;display:grid;place-items:center;padding:8px;transition:box-shadow .2s}
.ts-hole svg,.ts-piece svg{display:block;width:100%;height:100%}
.ts-hole-svg g{stroke:#2A1C12}
.ts-hole.glow{animation:holeglow 1.2s ease-in-out infinite}
@keyframes holeglow{50%{box-shadow:0 0 0 6px #FFF3B0,0 0 26px 10px #FFD93D}}
.ts-hole.in svg{animation:pop .4s ease}
.ts-tray{display:flex;flex-wrap:wrap;gap:4vmin;justify-content:center}
.ts-piece{padding:0;touch-action:none;filter:drop-shadow(0 6px 0 rgba(29,42,68,.35))}
.ts-piece.lift{position:relative;z-index:10;filter:drop-shadow(0 14px 6px rgba(29,42,68,.35))}
.ts-piece.wig{animation:shake .4s ease}

/* Feed the Animals */
.tf-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:space-around;gap:3vmin;padding:3vmin;overflow:hidden;background:linear-gradient(180deg,#FFF6DA 0%,#FFF6DA 68%,#E8C9A0 68%);border:3px solid var(--ink);border-radius:28px}
.tf-plate{display:grid;grid-template-columns:repeat(3,auto);gap:2vmin;padding:4vmin 5vmin;background:#fff;border:5px solid var(--ink);border-radius:46%;box-shadow:inset 0 0 0 10px #EAF2F7,0 6px 0 var(--ink)}
.tf-food{font-size:clamp(46px,10vmin,92px);line-height:1;padding:4px;border-radius:20px;touch-action:none;transition:opacity .3s}
.tf-food.full{opacity:.3}
.tf-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:2vmin}
.tf-animal{font-size:clamp(110px,30vmin,270px);line-height:1}
.tf-animal.in{animation:tfin .7s cubic-bezier(.3,1.4,.5,1) both}
.tf-animal.out{animation:tfout .6s ease-in forwards}
.tf-animal.chomp{animation:chomp .35s ease}
@keyframes tfin{from{transform:translateX(70vw) rotate(10deg)}}
@keyframes tfout{to{transform:translateX(70vw) rotate(12deg)}}
@keyframes chomp{30%{transform:scale(1.14,.88)}65%{transform:scale(.94,1.08)}}
.tf-dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tf-dot{width:clamp(36px,6.4vmin,56px);height:clamp(36px,6.4vmin,56px);border-radius:50%;border:4px dashed var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,3.8vmin,32px);background:rgba(255,255,255,.7)}
.tf-dot.on{background:var(--math);border-style:solid;animation:pop .4s ease}
.tf-yum{position:absolute;top:-8%;z-index:3;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vmin,54px);color:#E8649A;-webkit-text-stroke:2px var(--ink);opacity:0;pointer-events:none}
.tf-yum.show{animation:yum 1.6s ease}
@keyframes yum{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.15)}75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}

/* Finger Paint */
.tp-wrap{width:100%;height:100%;display:flex;gap:12px}
.tp-paper{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#fff;border:3px solid var(--ink);border-radius:24px}
.tp-cv{display:block;touch-action:none}
.tp-paper.wipe::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 30%,#fff 70%,rgba(255,255,255,0));animation:wipe .55s ease forwards;pointer-events:none}
@keyframes wipe{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tp-bar{display:grid;grid-template-columns:repeat(2,auto);gap:12px;align-content:center;justify-items:center}
.tp-col,.tp-tool{width:clamp(50px,8.6vmin,72px);height:clamp(50px,8.6vmin,72px);border-radius:50%;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:0;touch-action:none}
.tp-col.rainbow{background:conic-gradient(#FF5A4E,#FFD93D,#4CBA68,#3E8BEF,#9C6BE0,#FF5A4E)}
.tp-tool{background:var(--paper);font-size:clamp(26px,4.6vmin,38px);display:grid;place-items:center}
.tp-col.on,.tp-tool.on{outline:5px solid var(--ink);outline-offset:3px;transform:scale(1.06)}

/* Animal Band */
.tm-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2vmin;padding:2vmin 2vmin 3vmin;overflow:hidden;background:linear-gradient(180deg,#FFE0EE,#FFF6FA);border:3px solid var(--ink);border-radius:28px}
.tm-title{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,3vmin,26px);color:var(--ink-soft)}
.tm-keys{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1.3vmin}
.tm-key{position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:2.4vmin;border-radius:22px;border:4px solid var(--ink);background:var(--kc);box-shadow:0 8px 0 var(--ink);touch-action:none}
.tm-key.hit{animation:keyhit .26s ease}
@keyframes keyhit{40%{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.15)}}
.tm-face{font-size:clamp(30px,7vmin,64px);line-height:1;pointer-events:none}
.tm-key.hit .tm-face{animation:pop .3s ease}
.tm-key.next{animation:keyglow 1s ease-in-out infinite}
@keyframes keyglow{50%{box-shadow:0 8px 0 var(--ink),0 0 0 7px #fff,0 0 34px 12px #FFD93D}}
.tm-note{position:absolute;top:0;left:50%;font-size:clamp(24px,5vmin,40px);pointer-events:none;animation:notefly .9s ease-out forwards}
@keyframes notefly{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-90px) rotate(15deg);opacity:0}}
.tm-songs{display:flex;gap:2.4vmin}
.tm-song{width:clamp(62px,10vmin,86px);height:clamp(62px,10vmin,86px);border-radius:50%;display:grid;place-items:center;font-size:clamp(32px,5.6vmin,46px);background:var(--paper)}
.tm-song.on{background:var(--math)}

/* Beep Beep! */
.tg-scene{position:relative;width:100%;height:100%;overflow:hidden;border:3px solid var(--ink);border-radius:28px;background:linear-gradient(180deg,#BDE5F2 0%,#E6F6FC 32%,#8FD16A 32%,#8FD16A 52%,#6B7280 52%,#6B7280 74%,#8FD16A 74%,#8FD16A 78%,#5AA9EC 78%,#3E7BE0 100%)}
.tg-lane{position:absolute;left:0;right:0}
.tg-road::after{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px)}
.tg-rail::after{content:"";position:absolute;left:0;right:0;bottom:4%;height:16%;background:linear-gradient(180deg,transparent 0 25%,#555 25% 40%,transparent 40% 62%,#555 62% 77%,transparent 77%),repeating-linear-gradient(90deg,#7A4A26 0 10px,transparent 10px 30px)}
.tg-sea::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:radial-gradient(circle 12px at 12px 0,#fff 60%,transparent 64%) 0 0/36px 12px repeat-x;opacity:.6}
.tg-v{position:absolute;left:0;bottom:6%;z-index:2;line-height:1;padding:0;background:none;border:0;white-space:nowrap;touch-action:none}
.tg-in{display:inline-block}
.tg-v.honk .tg-in{animation:honk .45s ease}
@keyframes honk{30%{transform:translateY(-14%) scale(1.15)}60%{transform:translateY(2%) scale(.95)}}
.tg-say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:20px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;white-space:nowrap;animation:pop .3s ease}

@media (orientation:portrait){
  .tod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tf-wrap{flex-direction:column-reverse}
  .tp-wrap{flex-direction:column}
  .tp-bar{grid-template-columns:repeat(6,auto);grid-auto-flow:row}
}
@media (max-width:640px){
  .tod-exit{width:54px;height:54px}
  .tm-keys{gap:4px}
  .tm-key{border-radius:14px;border-width:3px}
}

.who-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:4px 0 8px}
.who-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;text-align:left;background:var(--paper)}
.who-btn .emoji{font-size:36px;line-height:1}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t b{font-family:var(--f-display);font-weight:900;font-size:20px}
.who-t small{font-size:14px;color:var(--ink-soft)}
.who-btn.on{background:var(--math-tint);outline:4px solid var(--math);outline-offset:2px}
.who-btn.tod.on{background:#FFE0EE;outline-color:var(--berry)}
@media (max-width:640px){.who-btns{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="app" id="app">

  <section class="screen splash" id="s-splash">
    <div class="cloud" style="left:6%;top:12%"></div>
    <div class="cloud" style="right:8%;top:24%;transform:scale(.75)"></div>
    <div class="pip-wrap" data-pip></div>
    <h1><span>Welcome to</span>Pip's Treehouse</h1>
    <button class="chunk btn-go" id="go-btn">Let's play!</button>
    <p class="fine">Turn the sound up. Pip reads everything out loud.</p>
    <div class="hill"></div>
  </section>

  <section class="screen home" id="s-home" hidden>
    <div class="cloud" style="left:30%;top:9%;transform:scale(.7)"></div>
    <div class="topline">
      <span class="pills"><span class="pill" id="home-stars" aria-label="Stars"></span><span class="pill tok-pill" id="home-tokens" aria-label="Game tokens"></span></span>
      <button class="chunk grownups" id="grown-btn">Grown-ups</button>
    </div>
    <div class="greet">
      <div class="pip-wrap" data-pip></div>
      <button class="bubble" id="home-bubble">Hi there! Pick a room.</button>
    </div>
    <button class="chunk adv-banner" id="adv-btn" aria-label="Today's Adventure">
      <span class="emoji adv-ic">🗺️</span>
      <span class="adv-txt"><span class="adv-t">Today&rsquo;s Adventure</span><span class="adv-s" id="adv-sub">3 stops and a treasure chest</span></span>
      <span class="adv-dots" id="adv-dots" aria-hidden="true"></span>
      <span class="adv-chest-mini emoji" aria-hidden="true">🎁</span>
    </button>
    <div class="rooms">
      <button class="chunk room-card read" id="room-read" aria-label="Reading Room">
        <span class="big">Aa</span><span class="name">Reading Room</span><span class="sub">letters · sounds · words</span>
      </button>
      <button class="chunk room-card math" id="room-math" aria-label="Number Nook">
        <span class="big">123</span><span class="name">Number Nook</span><span class="sub">count · add · shapes</span>
      </button>
    </div>
    <div class="themes" id="themes">
      <button class="chunk room-card theme bake" id="room-bake" aria-label="Pip's Bakery"><span class="big emoji">🧁</span><span class="tx"><span class="name">Pip&rsquo;s Bakery</span><span class="sub">cookies · pizza · cupcakes</span></span></button>
      <button class="chunk room-card theme art" id="room-art" aria-label="Art Studio"><span class="big emoji">🎨</span><span class="tx"><span class="name">Art Studio</span><span class="sub">paint · color · draw</span></span></button>

        el('div', { class: 'sk-lvl', text: 'Level ' + st.level + ' of ' + g.levels.length + ': ' + lvl[0] + (lvl[1] === 'beyond' ? ' (1st grade)' : lvl[1] === 'g2' ? ' (2nd grade)' : '') })
      ]));
      row.append(el('div', { class: 'sk-acc' }, pct === null ? [el('span', { class: 'fine', text: 'No answers yet' })] : [
        el('span', { text: pct + '% first try' }), el('span', { class: 'fine', text: ' · last ' + rec.length }),
        el('div', { class: 'acc' }, el('i', { style: 'width:' + pct + '%' }))
      ]));
      var minus = el('button', { class: 'chunk', 'aria-label': 'Lower level', text: '−', onclick: function () { setLevel(-1); } });
      var plus = el('button', { class: 'chunk', 'aria-label': 'Raise level', text: '+', onclick: function () { setLevel(1); } });
      if (st.level <= 1) minus.disabled = true;
      if (st.level >= g.levels.length) plus.disabled = true;
      row.append(el('div', { class: 'sk-right' }, [el('span', { class: 'chip ' + stc[1], text: stc[0] }), el('div', { class: 'stepper' }, [minus, el('span', { text: 'Level ' + st.level }), plus])]));
    }
    function setLevel(d) {
      var st = gs(g.id);
      st.level = Math.min(g.levels.length, Math.max(1, st.level + d)); st.weak = 0;
      save(true); draw();
    }
    draw();
    return row;
  }
  function syncText() {
    return Cloud.on ? 'Progress saves to your Claude account, so it follows you to any device where you’re signed in.' : 'Progress saves in this browser on this device.';
  }

  /* ---------------- wiring ---------------- */
  var App = {
    refresh: function () {
      refreshPips();
      if (current === 'home') renderHome(false);
      else if (current === 'room') renderRoom(roomWorld, false);
      else if (current === 'adv') renderAdventure(false);
      else if (current === 'shop') renderShop(false);
      else if (current === 'arcade') renderArcade(false);
      else if (current === 'parents') renderParents();
    },
    refreshSync: function () { var l = $('#sync-line'); if (l) l.textContent = syncText(); }
  };

  $('#go-btn').addEventListener('click', function () {
    SFX.unlock();
    if (todMode()) { renderToddler(true); return; }
    renderHome(false);
    var name = S.name.trim();
    Voice.say("Hi" + (name ? ' ' + name : '') + "! I'm Pip. Let's play and learn. Pick a room!");
  });
  $('#home-bubble').addEventListener('click', function () { Voice.say($('#home-bubble').textContent); });
  $('#room-read').addEventListener('click', function () { renderRoom('read', true); });
  $('#room-math').addEventListener('click', function () { renderRoom('math', true); });
  $('#room-boo').addEventListener('click', function () { renderRoom('boo', true); });
  $('#room-bake').addEventListener('click', function () { renderRoom('bake', true); });
  $('#room-art').addEventListener('click', function () { renderRoom('art', true); });
  $('#room-space').addEventListener('click', function () { renderRoom('space', true); });
  $('#room-bug').addEventListener('click', function () { renderRoom('bug', true); });
  $('#room-snow').addEventListener('click', function () { renderRoom('snow', true); });
  $('#mix-btn').addEventListener('click', function () { startRound('mix'); });
  $('#stk-btn').addEventListener('click', function () { renderStickers(); });
  [['#tod-exit', 'Grown-ups: hold to switch'], ['#tgame-exit', 'Hold to go back']].forEach(function (b) { $(b[0]).innerHTML = ICON.home + '<svg class="tod-ring" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="31" pathLength="100"/></svg><span class="tod-hint">' + b[1] + '</span>'; });
  $('#tod-exit').setAttribute('aria-label', 'Grown-ups: hold to switch to the big-kid games');
  holdToLeave($('#tod-exit'), function () {
    openGate(function () { setMode('big'); renderHome(true); }, 'Type the answer to switch back to the big-kid games.');
  });
  holdToLeave($('#tgame-exit'), function () { if (todStop) { todStop(); todStop = null; } renderToddler(true); });
  $('#stk-prev').innerHTML = ICON.back; $('#stk-next').innerHTML = ICON.back;
  $('#stk-prev').addEventListener('click', function () { turnStickerPage(-1); });
  $('#stk-next').addEventListener('click', function () { turnStickerPage(1); });
  (function () {
    var book = $('#stk-grid'), x0 = null, y0 = 0;
    book.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
    book.addEventListener('pointerup', function (e) {
      if (x0 == null) return; var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) turnStickerPage(dx < 0 ? 1 : -1);
    });
    window.addEventListener('resize', fitStickers);
  })();
  $('#adv-btn').addEventListener('click', function () { renderAdventure(true); });
  $('#arc-btn').addEventListener('click', function () { renderArcade(true); });
  $('#arc-back').addEventListener('click', function () { renderHome(false); });
  $('#mini-quit').addEventListener('click', function () { if (miniStop) { miniStop(); miniStop = null; } if (miniFrom) renderRoom(miniFrom, false); else renderArcade(false); });
  $('#shop-btn').addEventListener('click', function () { shopPick = null; renderShop(true); });
  $('#adv-back').addEventListener('click', function () { renderHome(false); });
  $('#shop-back').addEventListener('click', function () { renderHome(false); });
  $('#sleep-stk').addEventListener('click', function () { renderStickers(); });
  $('#sleep-shop').addEventListener('click', function () { shopPick = null; renderShop(true); });
  $('#sleep-grown').addEventListener('click', openGate);
  $('#stk-back').addEventListener('click', function () { renderHome(true); });
  $('#room-back').addEventListener('click', function () { renderHome(true); });
  $('#grown-btn').addEventListener('click', openGate);
  $('#quit-btn').addEventListener('click', function () {
    if (round && round.res.length) save(true);
    var world = round && !round.mix ? G[round.id].world : null, adv = round && round.adv != null;
    round = null;
    $('#stage').innerHTML = ''; $('#choices').innerHTML = '';
    if (adv) renderAdventure(false); else if (world) renderRoom(world, false); else renderHome(false);
  });
  $('#again-btn').addEventListener('click', function () { if (round && round.q) speakQ(round.q, null, true); });
  $('#q-text').addEventListener('click', function () { if (round && round.q) speakQ(round.q, null, true); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Voice.stop(); if (dirty) Cloud.push(); }
  });

  renderHome(false); show('splash');
  Cloud.init();
})();
</script>

/* Offline support + installable app (Add to Home Screen) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
