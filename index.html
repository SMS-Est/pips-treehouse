<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#BDE5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pip's Treehouse">
<meta name="description" content="Kindergarten reading, spelling and math games with spoken directions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* page reset (the artifact viewer supplied this; the standalone site needs its own) */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<!-- Pip's Treehouse v1.5.0 -->
<link rel="stylesheet" href="fonts/fonts.css">
<title>Pip's Treehouse</title>
<style>
:root{
  /* Layout: one-screen treehouse app. Sky backdrop, chunky ink-outlined cards that press down like real buttons, school-ruled lines (blue top, dashed middle, red base) under every printed word. */
  --sky:#BDE5F2; --sky-hi:#E8F7FC; --ink:#1D2A44; --ink-soft:#56658A; --paper:#FFFDF6;
  --read:#FF7A62; --read-tint:#FFE0D8; --math:#FFC43F; --math-tint:#FFEFC2;
  --leaf:#4CBA68; --berry:#E8649A; --sea:#5AA9EC; --grape:#9C7CF0;
  --rule-blue:#8DBBE8; --rule-red:#EE8577; --dim:#DCE3EC;
  /* Halloween Hollow: friendly night, not scary */
  --night:#2B2252; --night-2:#4B3B82; --pumpkin:#FF8A1F; --pumpkin-tint:#FFE2C2; --wood:#8A5A34; --house:#6A51B8; --roof:#36275F;
  --moon:#FFF0B3; --mist:#CFC6F0; --potion:#E6DCFF;
  --f-display:"Grandstander","Chalkboard SE","Marker Felt","Trebuchet MS",sans-serif;
  --f-print:"Andika","Avenir Next","Century Gothic","Helvetica Neue",Arial,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:22px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--sky)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-hi) 100%);color:var(--ink);font-family:var(--f-print);font-size:18px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text;font:inherit;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.emoji{font-family:var(--f-emoji);line-height:1;font-weight:400}

.app{height:100%;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px;position:relative}

/* chunky sticker buttons */
.chunk{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 6px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease,background-color .2s ease,opacity .2s}
.chunk:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.icon-btn{width:60px;height:60px;flex:none;display:grid;place-items:center;border-radius:18px}
.ico{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.star-ico{display:block}
.star-ico path{fill:var(--math);stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round}
.star-ico.empty path{fill:var(--paper);stroke:var(--ink-soft);stroke-dasharray:2.4 2}

/* Pip the treehouse bird */
.pip{display:block;overflow:visible}
.pip .p-body{fill:#5CC97A;stroke:var(--ink);stroke-width:4}
.pip .p-belly{fill:var(--paper)}
.pip .p-eye{fill:#fff;stroke:var(--ink);stroke-width:3}
.pip .p-pupil{fill:var(--ink)}
.pip .p-shine{fill:#fff}
.pip .p-beak{fill:#FF9F43;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.pip .p-cheek{fill:#FF8FAB;opacity:.75}
.pip .p-wing{fill:#46B064;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.pip .p-stem{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.pip .p-leaf{fill:#8EDC8A;stroke:var(--ink);stroke-width:3}
.pip .p-foot{fill:none;stroke:#E8862A;stroke-width:4;stroke-linecap:round}
.pip-wrap{transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.pip-wrap.cheer{animation:cheer .7s ease}
.pip-wrap.think{animation:think .6s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes cheer{0%{transform:translateY(0) scale(1)}25%{transform:translateY(4px) scale(1.08,.9)}55%{transform:translateY(-22px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes think{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}

/* speech bubble */
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:10px 18px;font-family:var(--f-display);font-weight:700;font-size:clamp(19px,3.4vmin,30px);line-height:1.2;text-align:left;max-width:min(34ch,100%);text-wrap:balance}
.bubble::before,.bubble::after{content:"";position:absolute;top:50%;width:0;height:0;border-style:solid;transform:translateY(-50%)}
.bubble::before{left:-17px;border-width:11px 16px 11px 0;border-color:transparent var(--ink) transparent transparent}
.bubble::after{left:-12px;border-width:8px 12px 8px 0;border-color:transparent var(--paper) transparent transparent}

/* ruled school-paper words */
.ruled{position:relative;display:inline-block;overflow:hidden;padding:0 .28em;line-height:1.5;font-family:var(--f-print);font-weight:700;white-space:nowrap;vertical-align:middle}
.rule{position:relative;display:inline-block;width:0;height:0;vertical-align:baseline}
.rule::before{content:"";position:absolute;left:-3em;width:80em;top:-1px;height:2px;background:var(--rule-red)}
.rule::after{content:"";position:absolute;left:-3em;width:80em;bottom:0;height:.74em;border-top:2px solid var(--rule-blue);background:repeating-linear-gradient(90deg,var(--rule-blue) 0 .16em,transparent .16em .3em) 0 calc(100% - .5em)/100% 2px no-repeat}
@supports (height:1cap){.rule::after{height:calc(1cap + .04em);background-position:0 calc(100% - 1ex)}}
.ruled .rt,.ruled .slot{position:relative;z-index:1}

/* ---------- splash ---------- */
.splash{align-items:center;justify-content:center;text-align:center;gap:18px}
.splash h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,10vmin,96px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.splash h1 span{display:block;font-size:.42em;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:.25em}
.splash .pip-wrap{width:clamp(150px,32vmin,260px)}
.btn-go{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5.4vmin,44px);padding:.35em 1.5em;background:var(--leaf)}
.splash .fine{font-size:15px;color:var(--ink-soft);max-width:36ch}

/* scenery */
.hill{position:absolute;left:0;right:0;bottom:0;height:16vh;pointer-events:none;z-index:0;background:radial-gradient(120% 100% at 20% 100%,#7FD18C 60%,transparent 61%),radial-gradient(110% 90% at 85% 100%,#6CC67C 58%,transparent 59%)}
.cloud{position:absolute;pointer-events:none;z-index:0;width:150px;height:46px;background:#fff;border-radius:40px;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;left:24px;top:-30px}
.cloud::after{width:46px;height:46px;left:76px;top:-20px}
.screen>*:not(.hill):not(.cloud){position:relative;z-index:1}

/* ---------- home ---------- */
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 16px 3px 6px;font-variant-numeric:tabular-nums}
.pill .star-ico{width:34px;height:34px}
.grownups{font-family:var(--f-display);font-weight:700;font-size:16px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.greet{display:flex;align-items:center;justify-content:center;gap:22px}
.greet .pip-wrap{width:clamp(90px,17vmin,150px);flex:none}
.rooms{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:1000px;margin:0 auto}
.room-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px;min-height:0;border-radius:28px}
.room-card.read{background:var(--read)}
.room-card.math{background:var(--math)}
.room-card .big{font-family:var(--f-print);font-weight:700;font-size:clamp(60px,14vmin,150px);line-height:1}
.room-card .name{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4.8vmin,44px);line-height:1.05}
.room-card .sub{font-size:clamp(15px,2.3vmin,19px);font-weight:700;opacity:.8}
.extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;max-width:1000px;margin:0 auto 6px}
.extra{display:flex;align-items:center;gap:14px;padding:10px 18px;text-align:left;border-radius:22px;min-height:76px}
.extra.mix{background:var(--leaf)}
.extra.stk{background:var(--berry)}
.extra .ex-ic{font-size:40px;flex:none}
.extra .ex-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.extra .ex-t{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.4vmin,28px);line-height:1.1}
.extra .ex-s{display:block;font-size:15px;font-weight:700}
.meter{display:block;height:10px;border-radius:6px;background:rgba(255,253,246,.7);border:2px solid var(--ink);overflow:hidden;margin-top:5px;width:min(220px,100%)}
.meter i{display:block;height:100%;background:var(--math)}

/* ---------- room ---------- */
.head{display:flex;align-items:center;gap:14px}
.head h2{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5.2vmin,46px);margin:0;line-height:1}
.room[data-room=read]{--room:var(--read);--room-tint:var(--read-tint)}
.room[data-room=math]{--room:var(--math);--room-tint:var(--math-tint)}
.room .head .tag{width:18px;height:18px;border-radius:50%;background:var(--room);border:3px solid var(--ink)}
.tiles{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:stretch;gap:16px;width:100%;max-width:1060px;margin:0 auto 8px;--cols:3}
.tiles[data-n="7"],.tiles[data-n="8"]{--cols:4}
.tiles[data-n="4"]{--cols:2;max-width:780px}
.tile{flex:0 0 calc((100% - (var(--cols) - 1) * 16px) / var(--cols));display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px;min-height:0;min-width:0;border-radius:24px}
.tile .thumb{flex:1;min-height:70px;display:flex;align-items:center;justify-content:center;gap:.14em;border-radius:16px;background:var(--room-tint);font-size:clamp(34px,6.4vmin,60px);line-height:1}
.tile .tname{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3vmin,26px);line-height:1.1}
.tile .tfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 2px}
.lvl{display:flex;gap:5px}
.lvl i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);display:block}
.lvl i.on{background:var(--room)}
.t-print{font-family:var(--f-print);font-weight:700}
.t-sm{font-size:.8em}
.t-op{font-family:var(--f-print);font-weight:700;font-size:.7em;color:var(--ink-soft)}
.t-tiles{display:flex;gap:.08em}
.t-tiles i{font-style:normal;display:grid;place-items:center;width:1.05em;height:1.05em;border:2.5px solid var(--ink);border-radius:.2em;background:var(--paper);font-family:var(--f-print);font-weight:700;font-size:.72em}
.t-word{font-family:var(--f-print);font-weight:700;border-bottom:3px solid var(--rule-red);padding:0 .1em;line-height:1.1}
.t-q{display:inline-block;border:3px dashed var(--ink);border-radius:.18em;padding:0 .12em;margin-left:.08em;line-height:1}
.t-shapes{width:1.9em;height:1.2em}

/* ---------- game ---------- */
.game{gap:10px}
.topbar{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(6px,1.6vmin,14px)}
.dot{width:clamp(30px,5.4vmin,46px);height:clamp(30px,5.4vmin,46px);border-radius:50%;border:3px dashed var(--ink-soft);display:grid;place-items:center;transition:transform .2s}
.dot.now{border:3px solid var(--ink);background:var(--paper);transform:scale(1.08)}
.dot.star,.dot.ok{border:0}
.dot.star .star-ico{width:120%;height:120%;animation:pop .45s ease}
.dot.ok{background:var(--leaf);border:3px solid var(--ink)}
.dot.ok .ico{width:62%;height:62%;stroke-width:3.4}
.speak{background:var(--sea)}
.ask{display:flex;align-items:center;justify-content:center;gap:20px;min-height:0}
.ask .pip-wrap{width:clamp(60px,11vmin,100px);flex:none}
.ask .bubble{cursor:pointer}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.choices{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:clamp(12px,2.4vmin,24px);padding:0 0 12px}
.choice{min-width:clamp(92px,15.5vmin,150px);min-height:clamp(92px,15.5vmin,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 14px;border-radius:24px}
.choice.correct{background:var(--leaf);animation:pop .45s ease}
.choice.wrong{background:var(--dim);opacity:.55;transform:translateY(4px);box-shadow:0 2px 0 var(--ink);animation:shake .4s ease}
.choice.hint{animation:glow 1.1s ease-in-out infinite}
.choice .glyph,.glyph{font-family:var(--f-print);font-weight:700;font-size:clamp(54px,11vmin,108px);line-height:1}
.choice .glyph.pair{font-size:clamp(46px,9vmin,90px);letter-spacing:.04em}
.choice .num{font-family:var(--f-print);font-weight:700;font-size:clamp(50px,10vmin,100px);line-height:1;font-variant-numeric:tabular-nums}
.choice.lbl{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4.6vmin,40px);padding:10px 26px}
.choice .ruled{font-size:clamp(38px,7.4vmin,72px)}
.picset{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;max-width:5.4em;font-size:clamp(46px,9vmin,86px)}
.picset[data-n="2"],.picset[data-n="3"]{font-size:clamp(34px,6.4vmin,62px)}
.picset[data-n="4"],.picset[data-n="5"]{font-size:clamp(28px,5.2vmin,50px)}
.picset.small .emoji{font-size:.5em}
.picset.big .emoji{font-size:1.15em}
.picset .emoji{display:block}
.wlabel{font-family:var(--f-print);font-weight:700;font-size:clamp(16px,2.6vmin,22px);margin-top:6px}
.choice svg.shape{width:clamp(80px,14vmin,140px);height:clamp(80px,14vmin,140px)}
.grp-in{display:grid;grid-template-columns:repeat(var(--cols),auto);gap:4px;font-size:clamp(28px,5.4vmin,50px)}
.choice.group{padding:14px 18px;min-width:clamp(150px,30vmin,300px)}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:8px}60%{translate:-6px}80%{translate:4px}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(232,100,154,.0)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 10px rgba(232,100,154,.55)}}

/* stage pieces */
.stage-pic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 26px 8px;border-radius:28px;position:relative}
.stage-pic .emoji{font-size:clamp(84px,20vmin,190px)}
.stage-pic .hear{position:absolute;right:-12px;top:-12px;width:42px;height:42px;border-radius:50%;background:var(--sea);border:3px solid var(--ink);display:grid;place-items:center}
.stage-pic .hear .ico{width:24px;height:24px}
.stage-pic.letter .glyph{font-size:clamp(100px,22vmin,200px);padding:0 .15em}
.objs{position:relative;width:min(100%,720px);aspect-ratio:5/3;max-height:100%}
.objs.rows{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;align-content:center;gap:10px 14px;aspect-ratio:auto}
.obj{position:absolute;transform:translate(-50%,-50%);font-size:clamp(38px,8.4vmin,74px);line-height:1;padding:4px;border-radius:16px}
.objs.rows .obj,.frame .obj{position:relative;transform:none}
.obj .cnt{position:absolute;top:-8px;right:-10px;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:var(--berry);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:17px;color:var(--ink);animation:pop .3s ease}
.obj.counted .emoji{opacity:.55}
.frames{display:flex;flex-direction:column;gap:14px;align-items:center}
.frame{--cell:clamp(46px,8.4vmin,78px);display:grid;grid-template-columns:repeat(5,var(--cell));grid-auto-rows:var(--cell);gap:3px;background:var(--ink);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.frame>span,.frame>button{background:var(--paper);display:grid;place-items:center}
.frame .obj{font-size:calc(var(--cell)*.66);padding:0;border-radius:0;width:100%;height:100%;display:grid;place-items:center}
.frame .obj .cnt{top:2px;right:2px;min-width:24px;height:24px;font-size:14px}
.frame .dotfill{width:70%;height:70%;border-radius:50%;background:var(--berry);border:3px solid var(--ink)}
.frame .empty{background:repeating-linear-gradient(45deg,var(--paper) 0 6px,#F3EFE2 6px 12px)}
.tens{display:flex;align-items:flex-end;gap:clamp(8px,1.8vmin,16px);--d:clamp(15px,2.9vmin,26px)}
.stick{display:flex;flex-direction:column;gap:3px;padding:5px;border:3px solid var(--ink);border-radius:12px;background:var(--math)}
.stick i,.one{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.ones{display:flex;flex-direction:column-reverse;gap:6px;margin-left:10px}
.one{background:var(--berry)}
.mathrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(10px,2vmin,18px)}
.grp{display:grid;grid-template-columns:repeat(var(--cols),auto);gap:4px;padding:10px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;font-size:clamp(30px,6vmin,56px)}
.grp .x{position:relative}
.grp .x .emoji{opacity:.35}
.grp .x::after{content:"";position:absolute;inset:8%;background:linear-gradient(45deg,transparent 44%,var(--read) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--read) 44% 56%,transparent 56%)}
.op{font-family:var(--f-print);font-weight:700;font-size:clamp(44px,8vmin,80px);line-height:1}
.eq{font-family:var(--f-print);font-weight:700;font-size:clamp(42px,8.6vmin,86px);line-height:1;display:flex;align-items:center;gap:.25em;font-variant-numeric:tabular-nums}
.qbox{display:inline-grid;place-items:center;min-width:1.15em;height:1.15em;border:3px dashed var(--ink);border-radius:.18em;color:var(--ink-soft);background:rgba(255,253,246,.7)}
.seq{display:flex;gap:clamp(8px,1.6vmin,14px);flex-wrap:wrap;justify-content:center}
.seq>span{min-width:1.35em;padding:.08em .18em;border:3px solid var(--ink);border-radius:16px;background:var(--paper);font-family:var(--f-print);font-weight:700;font-size:clamp(40px,8vmin,78px);line-height:1.15;text-align:center;font-variant-numeric:tabular-nums}
.seq>span.blank{border-style:dashed;color:var(--ink-soft);background:rgba(255,253,246,.6)}
.readline{display:flex;flex-wrap:wrap;justify-content:center;max-width:100%;padding:12px 10px;background:var(--paper);border:3px solid var(--ink);border-radius:24px}
.readline .ruled{font-size:clamp(46px,10vmin,100px);padding:0 .18em}
.readline.long .ruled{font-size:clamp(32px,6.6vmin,64px)}
.stage svg.shape{width:clamp(140px,26vmin,240px);height:clamp(140px,26vmin,240px)}

/* spelling */
.spellbox{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.spellbox .stage-pic .emoji{font-size:clamp(70px,15vmin,140px)}
.spellrow{font-size:clamp(56px,12vmin,116px);background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:4px .3em}
.spellrow .slot{display:inline-block;width:.86em;margin:0 .03em;text-align:center;border-radius:.12em;box-shadow:inset 0 0 0 3px rgba(29,42,68,.16)}
.spellrow .slot.faint{color:rgba(29,42,68,.2)}
.spellrow .slot.next{background:rgba(255,196,63,.42)}
.spellrow .slot.in{animation:pop .3s ease}
.ltile{min-width:clamp(70px,11.5vmin,108px);min-height:clamp(70px,11.5vmin,108px);display:grid;place-items:center;border-radius:20px;background:var(--math-tint)}
.ltile .glyph{font-size:clamp(44px,8.6vmin,82px)}
.ltile.used{visibility:hidden}
.ltile.nope{animation:shake .4s ease;background:var(--dim)}

/* ---------- round end ---------- */
.end{align-items:center;justify-content:center;text-align:center}
.end-card{background:var(--paper);border:3px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:22px 26px;max-width:640px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.end-stars{display:flex;gap:6px;align-items:center}
.end-stars .star-ico{width:clamp(44px,9vmin,72px);height:clamp(44px,9vmin,72px)}
.end-stars .bonus{font-family:var(--f-display);font-weight:900;font-size:22px;margin-left:6px;display:flex;align-items:center;gap:2px}
.end-stars .bonus .star-ico{width:32px;height:32px}
.end-stars .star-ico:not(.empty){animation:pop .5s ease both}
.end h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vmin,52px);margin:0;line-height:1.05;text-wrap:balance}
.end .sub{margin:0;font-size:18px;color:var(--ink-soft);font-weight:700}
.ribbon{font-family:var(--f-display);font-weight:900;font-size:22px;background:var(--grape);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px}
.newstk{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:800;font-size:22px}
.newstk .disc{width:84px;height:84px;border-radius:50%;background:var(--math-tint);border:3px solid var(--ink);display:grid;place-items:center;font-size:52px;animation:spin-in .8s ease both}
@keyframes spin-in{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.15) rotate(10deg)}100%{transform:none}}
.end-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,3.2vmin,24px);padding:12px 22px;border-radius:20px}
.btn.go{background:var(--leaf)}

/* ---------- stickers ---------- */
.stickers .grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px;align-content:start;padding:6px 4px 16px;max-width:1000px;width:100%;margin:0 auto}
.stk-disc{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:clamp(40px,7vmin,58px);box-shadow:0 4px 0 var(--ink)}
.stk-disc.locked{background:repeating-linear-gradient(45deg,#EAF2F7 0 8px,#DCE8F0 8px 16px);font-family:var(--f-display);font-weight:900;color:var(--ink-soft);font-size:clamp(28px,5vmin,40px);box-shadow:none}
.stickers .note{text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:50;background:rgba(29,42,68,.55);display:grid;place-items:center;padding:16px}
.gate-card{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate-card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px}
.gate-card p{margin:0;font-size:16px;color:var(--ink-soft)}
.gate-q{font-family:var(--f-print);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums}
.gate-in{min-height:52px;border:3px dashed var(--ink-soft);border-radius:14px;font-family:var(--f-print);font-weight:700;font-size:34px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.gate-in.bad{animation:shake .4s ease;border-color:var(--read)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:58px;font-family:var(--f-print);font-weight:700;font-size:26px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.gate-x{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink-soft);padding:8px}

/* ---------- grown-ups ---------- */
.parents{overflow-y:auto;display:block;padding-block:12px 28px;-webkit-overflow-scrolling:touch;font-size:16px;line-height:1.45}
.pwrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px 18px}
.panel h3{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:22px}
.panel .lede{margin:0 0 10px;color:var(--ink-soft);max-width:68ch}
.summary{display:flex;flex-wrap:wrap;gap:10px 26px;margin:6px 0 12px}
.summary div{display:flex;flex-direction:column}
.summary b{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.summary span{font-size:14px;color:var(--ink-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px;padding-top:8px}
.week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.week .bar{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--sea);border:2px solid var(--ink);min-height:3px}
.week .bar.zero{background:var(--dim);border-color:var(--dim)}
.week .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.week .d{font-size:13px;color:var(--ink-soft)}
.week .col.today .d{color:var(--ink);font-weight:700}
.skill{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) auto;gap:10px 16px;align-items:center;padding:12px 0;border-top:2px dashed var(--dim)}
.skill:first-of-type{border-top:0}
.sk-name{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.sk-std{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sk-lvl{font-size:14px;margin-top:2px}
.sk-acc{font-size:14px;font-variant-numeric:tabular-nums}
.acc{height:10px;border-radius:6px;background:var(--dim);overflow:hidden;margin-top:4px}
.acc i{display:block;height:100%;background:var(--leaf);border-radius:6px}
.sk-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.2;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.chip.new{background:var(--dim)}
.chip.working{background:#FFE6A6}
.chip.meets{background:#BFEACB}
.chip.ahead{background:#F7C5DB}
.stepper{display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:34px;border-radius:10px;box-shadow:0 3px 0 var(--ink);font-family:var(--f-print);font-weight:700;font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lab{font-weight:700;font-size:15px}
.field input,.field select{border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:17px;max-width:420px}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;width:max-content}
.seg button{padding:9px 16px;font-weight:700;font-size:15px;background:#fff}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sbtn{font-family:var(--f-display);font-weight:700;font-size:16px;padding:9px 16px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.sbtn.danger{background:#FFD6CE}
.fine{font-size:14px;color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 2px;font-size:14px;align-items:center}

.extra.shop{background:var(--grape)}
.adv{overflow-y:auto;gap:14px}

/* ---------- tokens + Arcade ---------- */
.pills{display:flex;gap:8px;align-items:center}
.tok-pill{padding:3px 16px 3px 10px}
.tok-pill .emoji{font-size:26px}
.extras.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.extra.arc{background:var(--math)}
.token-win{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:22px;background:var(--math-tint);border:3px solid var(--ink);border-radius:999px;padding:4px 18px 4px 10px;animation:pop .6s ease}
.token-win .emoji{font-size:34px}
.bonus-btn{background:var(--math);display:inline-flex;align-items:center;gap:6px}
.arcade{overflow-y:auto;gap:14px}
.head .tok-pill{margin-left:auto}
.arc-games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;max-width:980px;margin:0 auto}
.arc-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:26px;text-align:center}
.arc-card.broke{opacity:.7}
.arc-ic{font-size:clamp(56px,11vmin,96px);line-height:1.1}
.arc-name{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,3.4vmin,28px);line-height:1.1}
.arc-blurb{font-size:15px;font-weight:700;color:var(--ink-soft)}
.arc-best{font-size:14px;font-weight:700}
.arc-cost{margin-top:4px;display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--math);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.arc-gallery{width:100%;max-width:980px;margin:0 auto}
.arc-gallery h3{margin:6px 0 8px;font-family:var(--f-display);font-weight:900;font-size:22px}
.gal-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gal-item{background:var(--paper);border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.color-svg{display:block;width:100%;height:auto}
.mini .topbar{gap:14px}
.mini-title{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,3.6vmin,30px);white-space:nowrap}
.mini-time{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.mini-time i{display:block;height:100%;background:var(--leaf);transition:width .2s linear}
.mini-score{margin-left:auto;min-width:64px;justify-content:center;font-size:26px}
.mini-score:empty{visibility:hidden}
.mini-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;border-radius:24px}
.mini-cv{display:block;touch-action:none;background:linear-gradient(180deg,var(--sky-hi),var(--sky));border:3px solid var(--ink);border-radius:24px}
#s-mini>#mini-result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:min(560px,calc(100% - 32px))}
.mini-result h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vmin,48px);margin:0}
.mini-result .sub{margin:0;font-size:20px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.8vmin,16px);width:min(100%,calc((100vh - 200px) * 1.15),760px)}
.mcard{aspect-ratio:1;perspective:600px;padding:0;border-radius:18px}
.mflip{position:relative;display:block;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.mcard.up .mflip{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mback{background:repeating-linear-gradient(45deg,var(--sea) 0 12px,#6FB6EF 12px 24px);font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vmin,56px);color:var(--paper);box-shadow:0 5px 0 var(--ink)}
.mfront{background:var(--paper);transform:rotateY(180deg);font-size:clamp(40px,7.5vmin,70px)}
.mcard.got .mfront{background:#C9F0D3}
.cpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(100%,900px)}
.cpage{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:20px}
.cpage .color-svg{border-radius:12px;border:2px solid var(--dim)}
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;width:100%;height:100%;align-items:center}
.cholder{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.cholder .color-svg{max-height:100%;width:auto;max-width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:20px;touch-action:manipulation}
.cholder [data-r]{cursor:pointer}
.cside{display:flex;flex-direction:column;gap:14px;align-items:center}
.cpal{display:grid;grid-template-columns:repeat(3,auto);gap:10px}
.crayon{width:clamp(44px,7vmin,62px);height:clamp(44px,7vmin,62px);border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.crayon.on{outline:5px solid var(--math);outline-offset:2px;transform:scale(1.08)}

/* ---------- Daily Adventure ---------- */
.adv-banner{display:flex;align-items:center;gap:14px;width:100%;max-width:1000px;margin:0 auto;padding:8px 18px;border-radius:22px;background:var(--sea);text-align:left}
.adv-banner .adv-ic{font-size:38px;flex:none}
.adv-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.adv-t{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,3.6vmin,30px);line-height:1.05}
.adv-s{font-size:15px;font-weight:700}
.adv-dots{display:flex;gap:6px}
.adv-dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.adv-dots i.on{background:var(--math)}
.adv-chest-mini{font-size:32px}
.adv-banner:not(.complete) .adv-chest-mini{animation:wiggle 1.6s ease-in-out infinite}
.adv-banner.complete{background:var(--leaf)}
.adv-note{text-align:center;margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.4vmin,28px)}
.adv-path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:16px;padding-top:10px}
.adv-link{width:clamp(16px,4vmin,44px);height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 8px,transparent 8px 14px)}
.adv-link.lit{background:var(--math);border:2px solid var(--ink)}
.adv-stop{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:clamp(120px,22vmin,200px);padding:8px;border-radius:22px;position:relative}
.adv-stop .thumb{display:flex;align-items:center;justify-content:center;gap:.12em;height:clamp(64px,12vmin,110px);border-radius:14px;background:var(--math-tint);font-size:clamp(28px,5vmin,46px)}
.adv-stop.boo .thumb{background:var(--pumpkin-tint)}
.adv-name{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,2.4vmin,20px);line-height:1.1;text-align:center}
.adv-badge{position:absolute;top:-12px;right:-12px;min-width:38px;height:38px;padding:0 8px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px}
.adv-badge .ico{width:22px;height:22px;stroke-width:3.4}
.adv-stop.done .adv-badge{background:var(--leaf)}
.adv-stop.now{animation:glow 1.4s ease-in-out infinite}
.adv-stop.now .adv-badge{background:var(--math)}
.adv-stop.later{opacity:.6}
.adv-chest{width:clamp(96px,17vmin,150px);border-radius:20px;padding:4px}
.adv-chest.ready{animation:wiggle 1.2s ease-in-out infinite}
.chest-svg{display:block;width:100%;height:auto}
.adv-cal{align-self:center;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;width:min(100%,420px)}
.cal-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.cal-top span{font-size:15px;color:var(--ink-soft);font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.cal-h{font-weight:700;font-size:13px;color:var(--ink-soft)}
.cal-d{display:grid;place-items:center;height:min(40px,9vw);border-radius:50%;font-size:14px}
.cal-d.today{outline:3px solid var(--sea);outline-offset:-1px}
.cal-d.got .star-ico{width:30px;height:30px}

/* ---------- Pip's Shop ---------- */
.head .shop-wallet{margin-left:auto}
.shop-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;width:100%;max-width:1100px;margin:0 auto}
.shop-view{min-height:0;display:flex;align-items:center;justify-content:center;background:var(--sky-hi);border:3px solid var(--ink);border-radius:24px;overflow:hidden}
.tree-svg{display:block;width:100%;height:100%;max-height:100%}
.shop-view{position:relative}
.shop-pip{position:absolute;left:3%;bottom:3%;width:clamp(80px,24%,170px)}
.shop-pip .pip{width:100%;height:auto;animation:bob 2.6s ease-in-out infinite}
.shop-side{display:flex;flex-direction:column;gap:10px;min-height:0}
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap}
.shop-tab{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:16px}
.shop-tab .emoji{font-size:20px}
.shop-tab.on{background:var(--math)}
.shop-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;align-content:start;padding:4px 4px 10px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.shop-item .emoji{font-size:40px;line-height:1.1}
.shop-item.picked{background:var(--math-tint);outline:4px solid var(--math);outline-offset:1px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink)}
.mini-pip{width:54px;height:56px;display:block}
.mini-pip svg{width:100%;height:100%}
.si-name{font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.1;text-align:center}
.si-price{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.si-price .star-ico{width:18px;height:18px}
.si-tag{font-size:12px;font-weight:700;background:var(--leaf);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.shop-act{min-height:58px;display:flex;align-items:center;justify-content:center}
.shop-act .btn .star-ico{display:inline-block;width:24px;height:24px;vertical-align:-4px}
.shop-hint{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center}

/* ---------- Pip sleeping ---------- */
.pip .p-lid{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;display:none}
.pip-wrap.sleeping .p-lid{display:inline}
.pip-wrap.sleeping .p-eye,.pip-wrap.sleeping .p-pupil,.pip-wrap.sleeping .p-shine{display:none}
.sleep{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%)}
.sleep .pip-wrap{width:clamp(130px,26vmin,220px);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
.sleep h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vmin,52px);color:var(--paper)}
.sleep-text{margin:0;max-width:34ch;font-size:19px;font-weight:700;color:var(--mist)}
.zzz{margin:0;font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--moon);letter-spacing:.2em;animation:floaty 2.4s ease-in-out infinite}

/* ---------- Story Time ---------- */
.story-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:min(100%,760px);font-family:var(--f-display)}
.st-title{font-weight:900;font-size:clamp(20px,3.6vmin,30px)}
.st-page{font-weight:700;font-size:15px;color:var(--ink-soft)}
.story-hero{font-size:clamp(64px,13vmin,120px);line-height:1}
.story-words .sw{transition:background-color .15s ease}
.story-words .sw.lit{background:var(--math-tint);border-radius:10px}
.story-words .sw.mystery{outline:4px dashed var(--berry);outline-offset:-4px;border-radius:12px;background:rgba(232,100,154,.08)}
.story-words.solved .sw.mystery{outline-color:var(--leaf);outline-style:solid;background:rgba(76,186,104,.16)}

/* ---------- Tracing ---------- */
.trace-wrap{display:flex;justify-content:center;width:100%}
.trace-cv{display:block;background:var(--paper);border:3px solid var(--ink);border-radius:24px;touch-action:none;cursor:crosshair;max-width:100%}
.t-trace{font-family:var(--f-print);font-weight:700;color:transparent;-webkit-text-stroke:2px var(--ink);letter-spacing:.04em}

/* celebrations */
.fly-star{position:fixed;left:0;top:0;width:46px;height:46px;z-index:61;pointer-events:none}
.fly-star .star-ico{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(255,196,63,.9))}
.dot.incoming .star-ico{opacity:0;animation:none}
.dot.landed .star-ico{animation:land .5s ease}
@keyframes land{0%{transform:scale(1.8)}50%{transform:scale(.85)}100%{transform:scale(1)}}
.praise-pop{position:fixed;z-index:61;pointer-events:none;white-space:nowrap;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vmin,58px);color:var(--math);text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);animation:praise-pop 1.25s ease-out forwards}
@keyframes praise-pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:0}18%{transform:translate(-50%,-110%) scale(1.2) rotate(4deg);opacity:1}65%{transform:translate(-50%,-150%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-210%) scale(.95);opacity:0}}
.streak-banner{position:fixed;left:50%;top:24%;z-index:62;pointer-events:none;white-space:nowrap;font-family:var(--f-display);font-weight:900;font-size:clamp(32px,7vmin,66px);background:var(--math);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:6px 30px;box-shadow:0 7px 0 var(--ink);animation:banner 1.8s cubic-bezier(.3,1.4,.5,1) forwards}
.streak-banner.boo{background:var(--pumpkin)}
@keyframes banner{0%{transform:translateX(-50%) scale(0) rotate(-12deg)}18%{transform:translateX(-50%) scale(1.12) rotate(3deg)}30%{transform:translateX(-50%) scale(1) rotate(0)}80%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-30px) scale(.9);opacity:0}}
.pip-wrap.spin{animation:spinjump .85s ease}
@keyframes spinjump{0%{transform:none}30%{transform:translateY(-26px) rotate(180deg)}60%{transform:translateY(-10px) rotate(360deg)}80%{transform:translateY(2px) scale(1.06,.94) rotate(360deg)}100%{transform:rotate(360deg)}}
.pip-wrap.dance{animation:dance 1s ease-in-out 4}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-14px) rotate(-10deg)}50%{transform:translateY(0) scale(1.06,.94)}75%{transform:translateY(-14px) rotate(10deg)}}
.gift{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:20px;padding:6px 18px}
.gift-box{font-size:76px;display:block;animation:wiggle 1.3s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0) scale(1)}70%{transform:rotate(-12deg) scale(1.08)}80%{transform:rotate(10deg) scale(1.08)}90%{transform:rotate(-6deg)}}

/* Pip is naming this one right now */
.choice,.seq>span{transition:transform .15s ease,box-shadow .15s ease,background-color .2s ease}
.choice.reading{transform:translateY(-4px) scale(1.05);box-shadow:0 6px 0 var(--ink),0 0 0 6px var(--math)}
.seq>span.reading{transform:scale(1.08);background:var(--math-tint)}

/* ---------- Halloween Hollow ---------- */
.rooms.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.room-card.boo{background:var(--pumpkin)}
.room-card.boo .big{font-size:clamp(56px,13vmin,140px)}
.t-door{display:inline-grid;place-items:center;width:.95em;height:1.3em;background:var(--wood);border:2.5px solid var(--ink);border-radius:.48em .48em .08em .08em;font-family:var(--f-print);font-weight:700;font-size:.62em;color:var(--paper)}
.spooky{--ink-soft:var(--mist);--room:var(--pumpkin);--room-tint:var(--pumpkin-tint);
  background:
    radial-gradient(circle at 7% 30%,var(--moon) 0 30px,rgba(255,240,179,.18) 31px 46px,transparent 47px),
    radial-gradient(circle 1.6px at 14% 12%,#fff 98%,transparent),radial-gradient(circle 1.4px at 31% 6%,#fff 98%,transparent),
    radial-gradient(circle 1.6px at 57% 15%,#fff 98%,transparent),radial-gradient(circle 1.2px at 72% 4%,#fff 98%,transparent),
    radial-gradient(circle 1.4px at 6% 34%,#fff 98%,transparent),radial-gradient(circle 1.2px at 95% 38%,#fff 98%,transparent),

.spooky .dot.now{background:var(--paper)}

.choice.ghosty:nth-child(2) .ghost-svg{animation-delay:-.7s}
.choice.ghosty:nth-child(3) .ghost-svg{animation-delay:-1.4s}
.choice.ghosty:nth-child(4) .ghost-svg{animation-delay:-2.1s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.house{position:relative;width:min(86%,620px);margin-top:clamp(44px,8vmin,72px);background:var(--house);border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;padding:clamp(44px,7.4vmin,64px) clamp(12px,2.4vmin,26px) 0}

.house .w2{right:10%}

.doors{display:flex;justify-content:space-around;align-items:flex-end;gap:clamp(8px,2vmin,18px)}

.door .knob{position:absolute;right:13%;top:60%;width:clamp(9px,1.6vmin,14px);height:clamp(9px,1.6vmin,14px);border-radius:50%;background:var(--math);border:2px solid var(--ink)}
.door .peek{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:clamp(34px,6.6vmin,62px);display:none}
.choice.door.correct{background:var(--night)}
.choice.door.correct .boo{display:block;animation:rise .6s ease both}
.choice.door.correct .knob,.choice.door.wrong .knob{display:none}
.choice.door.wrong{background:var(--night);opacity:.85;transform:none;box-shadow:none}
.choice.door.wrong .nope{display:block}
.choice.door.wrong .plate{opacity:.55}
@keyframes rise{0%{transform:translate(-50%,40%) scale(.4);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}

.tot{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(16px,3.4vmin,36px);--cs:clamp(30px,5.4vmin,50px)}
.pile{display:grid;grid-template-columns:repeat(6,auto);gap:4px;padding:12px;border:3px dashed var(--mist);border-radius:22px;background:rgba(255,253,246,.1)}
.candy{font-size:var(--cs);line-height:1;padding:3px;border-radius:12px;position:relative}
.candy.gone{visibility:hidden}
.candy.pre{opacity:.95}
.candy .cnt{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:var(--berry);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:13px;color:var(--ink)}
.bucket-col{display:flex;flex-direction:column;align-items:center;gap:clamp(30px,5vmin,44px)}
.tsign{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:2px 14px;box-shadow:0 5px 0 var(--ink)}
.tsign .num{font-family:var(--f-print);font-weight:700;font-size:clamp(40px,8vmin,72px);line-height:1.1;font-variant-numeric:tabular-nums}
.tsign .emoji{font-size:clamp(28px,5vmin,44px)}
.bucket{position:relative;min-width:calc(var(--cs) * 5 + 64px);min-height:calc(var(--cs) * 2.2 + 70px);padding:14px 16px 44px;background:var(--pumpkin);border:3px solid var(--ink);border-radius:20px 20px 64px 64px/20px 20px 46px 46px}
.bucket::before{content:"";position:absolute;left:14%;right:14%;bottom:calc(100% - 4px);height:clamp(26px,5vmin,40px);border:5px solid var(--ink);border-bottom:0;border-radius:80px 80px 0 0}
.bgrid{display:grid;grid-template-columns:repeat(5,calc(var(--cs) + 8px));gap:2px;justify-content:center}
.bucket .grin{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:clamp(54px,9vmin,80px)}
.bucket .grin svg{display:block;width:100%;height:auto}
.done-btn{display:inline-flex;align-items:center;gap:8px;font-size:clamp(24px,4.4vmin,36px);padding:10px 30px}
.done-btn .ico{width:30px;height:30px;stroke-width:3.4}
.done-btn.nope{animation:shake .4s ease}

canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (max-width:640px){
  .rooms,.rooms.three,.extras,.extras.four{grid-template-columns:1fr}
  .arc-games,.cpick{grid-template-columns:1fr}
  .cwrap{grid-template-columns:1fr}
  .cpal{grid-template-columns:repeat(6,auto)}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home{overflow-y:auto}
  .home .rooms{flex:none}
  .tiles,.tiles[data-n]{--cols:2}
  .skill{grid-template-columns:1fr}
  .sk-right{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .ask{gap:14px}
  .bubble::before,.bubble::after{display:none}
}
@media (orientation:portrait) and (min-width:641px){
  .tiles,.tiles[data-n]{--cols:2}
  .shop-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .extras.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cwrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .cpal{grid-template-columns:repeat(6,auto)}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,560px)}
}
@media (max-height:560px){
  .greet .pip-wrap{width:70px}
  .hill{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>

<div class="app" id="app">

  <section class="screen splash" id="s-splash">
    <div class="cloud" style="left:6%;top:12%"></div>
    <div class="cloud" style="right:8%;top:24%;transform:scale(.75)"></div>
    <div class="pip-wrap" data-pip></div>
    <h1><span>Welcome to</span>Pip's Treehouse</h1>
    <button class="chunk btn-go" id="go-btn">Let's play!</button>

  <section class="screen home" id="s-home" hidden>

      <button class="chunk grownups" id="grown-btn">Grown-ups</button>

      <span class="emoji adv-ic">🗺️</span>
      <span class="adv-txt"><span class="adv-t">Today&rsquo;s Adventure</span><span class="adv-s" id="adv-sub">3 stops and a treasure chest</span></span>
      <span class="adv-dots" id="adv-dots" aria-hidden="true"></span>
      <span class="adv-chest-mini emoji" aria-hidden="true">🎁</span>
    </button>
    <div class="rooms">
      <button class="chunk room-card read" id="room-read" aria-label="Reading Room">

      </button>
      <button class="chunk room-card boo" id="room-boo" aria-label="Halloween Hollow" hidden>
        <span class="big emoji">🎃</span><span class="name">Halloween Hollow</span><span class="sub">ghosts · candy · spells</span>

      <button class="chunk extra arc" id="arc-btn"><span class="ex-ic emoji">🎟️</span><span class="ex-txt"><span class="ex-t">Arcade</span><span class="ex-s" id="arc-sub">bonus games</span></span></button>
      <button class="chunk extra shop" id="shop-btn"><span class="ex-ic emoji">🛍️</span><span class="ex-txt"><span class="ex-t">Pip&rsquo;s Shop</span><span class="ex-s">spend your stars</span></span></button>

    </div>

  <section class="screen room" id="s-room" hidden>

  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
</div>

<script id="pip-content">
/* =====================================================================
   CONTENT: word lists, standards map, and question generators.
   Pure data + functions (no DOM) so they can be tested on their own.
   ===================================================================== */
window.PipContent = (function () {
  'use strict';
  var R = {
    int: function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },

    shuffle: function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    sample: function (a, k) { return R.shuffle(a).slice(0, k); },
    chance: function (p) { return Math.random() < p; }

  var UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  function L(c) { return LN[String(c).toLowerCase()]; }

  var NUM = ['zero', 'one', 'two', 'three', 'four', 'five'];

  /* ---- Balloon Pop: 60 seconds, golden balloons are worth 5 ---- */
  function gameBalloon(area, api) {
    var cv = el('canvas', { class: 'mini-cv', 'aria-label': 'Balloons' }); area.append(cv);
    var W = Math.max(200, area.clientWidth - 6), H = Math.max(200, area.clientHeight - 6), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COLS = ['#FF7A62', '#FFC43F', '#4CBA68', '#5AA9EC', '#E8649A', '#9C7CF0', '#FF8A1F'];
    var balloons = [], score = 0, dur = 60000, t0 = 0, last = 0, lastSpawn = 0, raf = 0, over = false, nextSay = 10;

      ['ellipse', 'cx="200" cy="160" rx="84" ry="78"'], ['ellipse', 'cx="200" cy="188" rx="50" ry="40"'],
      ['path', 'd="M120 160 C98 172 100 200 124 206 C134 192 134 174 120 160Z"'], ['path', 'd="M280 160 C302 172 300 200 276 206 C266 192 266 174 280 160Z"'],
      ['circle', 'cx="170" cy="138" r="20"'], ['circle', 'cx="230" cy="138" r="20"'], ['circle', 'cx="148" cy="168" r="11"'], ['circle', 'cx="252" cy="168" r="11"'],
      ['path', 'd="M186 158 L214 158 L200 176Z"']],
      deco: '<circle cx="173" cy="141" r="9" fill="#1D2A44" pointer-events="none"/><circle cx="233" cy="141" r="9" fill="#1D2A44" pointer-events="none"/><circle cx="177" cy="136" r="3" fill="#fff" pointer-events="none"/><circle cx="237" cy="136" r="3" fill="#fff" pointer-events="none"/><path d="M178 236 L172 254 M178 236 L184 254 M222 236 L216 254 M222 236 L228 254" stroke="#1D2A44" stroke-width="5" stroke-linecap="round" pointer-events="none"/>' },
    tree: { name: 'Treehouse', parts: [

      ['rect', 'x="122" y="190" width="166" height="14" rx="3"'], ['rect', 'x="142" y="130" width="126" height="62"'], ['path', 'd="M130 132 L205 90 L280 132 Z"'],
      ['rect', 'x="152" y="146" width="28" height="22" rx="3"'], ['path', 'd="M194 192 V164 Q207 148 220 164 V192 Z"']],

    boo: { name: 'Pumpkin night', parts: [
      ['rect', 'x="0" y="0" width="400" height="320"'], ['circle', 'cx="330" cy="62" r="36"'], ['path', 'd="M0 268 Q120 222 230 256 Q320 232 400 262 V320 H0 Z"'],
      ['path', 'd="M80 270 C40 270 34 196 80 188 C100 180 128 182 150 188 C196 196 190 270 150 270 Z"'], ['path', 'd="M110 186 C108 172 112 162 122 156 L128 162 C120 168 118 176 120 186 Z"'],
      ['path', 'd="M90 214 L104 214 L97 202Z"'], ['path', 'd="M128 214 L142 214 L135 202Z"'], ['path', 'd="M88 236 Q115 256 144 236 L136 242 L128 236 L120 244 L112 236 L104 244 L96 236Z"'],
      ['path', 'd="M250 230 V160 a40 40 0 0 1 80 0 V230 l-13 -11 -13 11 -14 -11 -13 11 -14 -11 z"']],
      deco: '<ellipse cx="276" cy="156" rx="6" ry="8" fill="#1D2A44" pointer-events="none"/><ellipse cx="304" cy="156" rx="6" ry="8" fill="#1D2A44" pointer-events="none"/><ellipse cx="290" cy="176" rx="6" ry="5" fill="#1D2A44" pointer-events="none"/>' }
  };
  function colorPageSVG(page, fills, thumb) {
    var pg = PAGES[page], s = '<svg class="color-svg' + (thumb ? ' thumb' : '') + '" viewBox="0 0 400 320" role="img" aria-label="' + pg.name + ' coloring page">';
    pg.parts.forEach(function (pt, i) {
      var f = pt[2] ? 'none' : (fills && fills[i]) || '#FFFFFF';
      s += '<' + pt[0] + ' data-r="' + i + '" ' + pt[1] + ' fill="' + f + '" stroke="#1D2A44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    return s + pg.deco + '</svg>';
  }
  function gameColor(area, api) {
    var crayon = CRAYONS[0], page = null, fills = {};
    function choose() {
      area.innerHTML = '';
      var pick = el('div', { class: 'cpick' });
      Object.keys(PAGES).forEach(function (k) {
        pick.append(el('button', { class: 'chunk cpage', 'aria-label': PAGES[k].name, onclick: function () { page = k; paint(); } }, [el('span', { html: colorPageSVG(k, {}, true) }), el('span', { class: 'arc-name', text: PAGES[k].name })]));
      });
      area.append(el('p', { class: 'adv-note', text: 'Pick a picture to color' }), pick);
      Voice.say('Pick a picture to color!');
    }
    function paint() {
      area.innerHTML = '';
      var holder = el('div', { class: 'cholder', html: colorPageSVG(page, fills) });
      holder.addEventListener('click', function (e) {
        var t = e.target, i = t.getAttribute && t.getAttribute('data-r');
        if (i == null || PAGES[page].parts[+i][2]) return;
        fills[i] = crayon; t.setAttribute('fill', crayon); SFX.tick();
        FX.burst(e.clientX, e.clientY, { n: 8, speed: 4, life: 500, kinds: ['star', 'dot'] });
      });
      var pal = el('div', { class: 'cpal', role: 'group', 'aria-label': 'Crayons' });
      CRAYONS.forEach(function (c) {
        var b = el('button', { class: 'crayon' + (c === crayon ? ' on' : ''), style: 'background:' + c, 'aria-label': 'Crayon' });
        b.addEventListener('click', function () { crayon = c; Array.prototype.forEach.call(pal.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); SFX.tick(); });
        pal.append(b);
      });
      var btns = el('div', { class: 'end-btns' }, [
        el('button', { class: 'chunk btn', text: 'Start over', onclick: function () { fills = {}; paint(); } }),
        el('button', { class: 'chunk btn go', text: 'All done!', onclick: function () {
          S.arcade.art.unshift({ page: page, fills: fills, date: dayKey() });
          if (S.arcade.art.length > 12) S.arcade.art.length = 12;
          api.end({ title: 'Beautiful!', text: 'Your picture is in the Art Gallery.' });
        } })]);
      area.append(el('div', { class: 'cwrap' }, [holder, el('div', { class: 'cside' }, [pal, btns])]));
      Voice.say('Tap a crayon, then tap a shape to color it.');
    }
    choose();
    return function () {};
  }

  /* ---------------- grown-ups gate ---------------- */
  var gateAns = '', gateTyped = '';
  function openGate() {
    var a = R.int(6, 9), b = R.int(6, 9);
    gateAns = String(a * b); gateTyped = '';
    $('#gate-q').textContent = a + ' × ' + b + ' = ?';
    $('#gate-in').textContent = '';
    $('#gate').hidden = false;
    Voice.stop();
  }
  (function buildKeys() {
    var k = $('#gate-keys');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'del'].forEach(function (d) {
      k.append(el('button', { class: 'chunk', text: d === 'del' ? '⌫' : d === 'clear' ? 'C' : d, 'aria-label': d === 'del' ? 'Delete' : d === 'clear' ? 'Clear' : d, onclick: function () {
        if (d === 'del') gateTyped = gateTyped.slice(0, -1);
        else if (d === 'clear') gateTyped = '';
        else if (gateTyped.length < 3) gateTyped += d;
        var inp = $('#gate-in'); inp.textContent = gateTyped; inp.classList.remove('bad');
        if (gateTyped.length >= gateAns.length && d !== 'del' && d !== 'clear') {
          if (gateTyped === gateAns) { $('#gate').hidden = true; Cloud.pull(function () { renderParents(); }); }
          else { void inp.offsetWidth; inp.classList.add('bad'); gateTyped = ''; setTimeout(function () { inp.textContent = ''; }, 400); }
        }
      } }));
    });
  })();
  $('#gate-x').addEventListener('click', function () { $('#gate').hidden = true; });

  /* ---------------- grown-ups page ---------------- */
  var STATUS = { 'new': ['Not tried yet', 'new'], working: ['Working toward K goal', 'working'], meets: ['Meets K goal', 'meets'], ahead: ['Ahead of K', 'ahead'] };
  function statusOf(g) {
    var st = gs(g.id);
    if (!st.q) return 'new';
    var top = st.mastered.length ? Math.max.apply(null, st.mastered) : 0;
    if (top < g.kGoal) return 'working';
    var beyond = st.mastered.some(function (l) { return g.levels[l - 1] && (g.levels[l - 1][1] === 'beyond' || g.levels[l - 1][1] === 'g2'); });
    return beyond ? 'ahead' : 'meets';
  }
  function weekKeys() {
    var out = [];
    for (var i = 6; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); out.push(d); }
    return out;
  }

  function renderParents() {
    var w = $('#pwrap'); w.innerHTML = '';
    var name = S.name.trim();
    w.append(el('div', { class: 'head' }, [
      el('button', { class: 'chunk icon-btn', 'aria-label': 'Back to games', html: ICON.home, onclick: function () { renderHome(false); } }),
      el('h2', { text: 'Grown-ups' })
    ]));

    /* summary + week */
    var days = weekKeys(), wq = 0, wc = 0, wd = 0, max = 1;
    var vals = days.map(function (d) { var x = S.days[dayKey(d)] || { q: 0, c: 0, r: 0 }; wq += x.q; wc += x.c; if (x.q) wd++; max = Math.max(max, x.q); return x; });
    var sum = el('section', { class: 'panel' });
    sum.append(el('h3', { text: name ? name + "'s week" : 'This week' }));
    sum.append(el('div', { class: 'summary' }, [
      stat(wd + ' / 7', 'days played'), stat(String(wq), 'questions answered'), stat(wq ? Math.round(wc / wq * 100) + '%' : '—', 'right on the first try'),
      stat(String(S.advDays.filter(function (k) { return k.slice(0, 7) === dayKey().slice(0, 7); }).length), 'adventure days this month'),
      stat(String(S.rounds), 'rounds all time'), stat(String(S.totalStars), 'stars earned · ' + stickersEarned() + ' stickers')
    ]));
    var week = el('div', { class: 'week', role: 'img', 'aria-label': 'Questions answered each day this week' });
    days.forEach(function (d, i) {
      var x = vals[i], hpct = x.q ? Math.max(6, Math.round(x.q / max * 100)) : 2;
      week.append(el('div', { class: 'col' + (i === 6 ? ' today' : '') }, [
        el('span', { class: 'v', text: x.q ? String(x.q) : '' }),
        el('span', { class: 'bar' + (x.q ? '' : ' zero'), style: 'height:' + hpct + '%' }),
        el('span', { class: 'd', text: i === 6 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' }) })
      ]));
    });
    sum.append(week);
    w.append(sum);

    /* skills */
    var booPlayed = GAMES.some(function (g) { return g.world === 'boo' && gs(g.id).q; });
    [['read', 'Reading & spelling'], ['math', 'Math'], ['boo', 'Halloween games']].forEach(function (pair) {
      if (pair[0] === 'boo' && !halloweenOn() && !booPlayed) return;
      var p = el('section', { class: 'panel' });
      p.append(el('h3', { text: pair[1] }));
      if (pair[0] === 'read') p.append(el('p', { class: 'lede', text: 'Each game moves up a level after a round with 4 or 5 right on the first try, and steps back after two rough rounds in a row. You can also set the level yourself.' }));
      if (pair[0] === 'boo') p.append(el('p', { class: 'lede', text: 'Seasonal practice for counting out objects, reading numbers to 20, letters and spelling. These show up from October 1 to November 7 unless you change it in Settings.' }));
      GAMES.filter(function (g) { return g.world === pair[0]; }).forEach(function (g) { p.append(skillRow(g)); });
      w.append(p);
    });

    /* settings */
    var set = el('section', { class: 'panel' });
    set.append(el('h3', { text: 'Settings' }));
    var nameIn = el('input', { id: 'set-name', type: 'text', maxlength: '24', autocomplete: 'off', placeholder: 'Your child’s first name', value: S.name });
    var nameTimer = 0;
    nameIn.addEventListener('input', function () { S.name = nameIn.value; clearTimeout(nameTimer); nameTimer = setTimeout(function () { save(true); }, 700); });
    set.append(el('div', { class: 'field' }, [el('label', { for: 'set-name', text: 'Name Pip says hello to' }), nameIn]));

    var vs = Voice.list();
    if (vs.length) {
      var sel = el('select', { id: 'set-voice' });
      sel.append(el('option', { value: '', text: 'Automatic (best available)' }));
      vs.forEach(function (v) { var o = el('option', { value: v.name, text: v.name + ' (' + v.lang + ')' }); if (v.name === S.settings.voice) o.selected = true; sel.append(o); });
      sel.addEventListener('change', function () { S.settings.voice = sel.value; Voice.choose(); save(true); Voice.say('Hi! I am Pip. Let’s learn together.'); });
      set.append(el('div', { class: 'field' }, [el('label', { for: 'set-voice', text: 'Pip’s voice' }), sel]));
    } else if (!Voice.ok) {
      set.append(el('p', { class: 'fine', text: 'This browser can’t speak out loud, so the questions show as text only. Safari on iPad speaks them.' }));
    }
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Talking speed' }), seg([['normal', 'Normal'], ['slow', 'Slower']], S.settings.rate, function (v) { S.settings.rate = v; save(true); Voice.say('This is how fast I talk.'); })]));
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Sound effects' }), seg([['on', 'On'], ['off', 'Off']], S.settings.sfx ? 'on' : 'off', function (v) { S.settings.sfx = v === 'on'; save(true); SFX.good(); })]));
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Play time' }), seg([['none', 'Any time'], ['after', 'Stop after the daily adventure']], S.settings.limit || 'none', function (v) { S.settings.limit = v; save(true); }),
      el('span', { class: 'fine', text: 'With "Stop after the daily adventure," Pip goes to sleep once she opens the treasure chest, and the games wait until tomorrow. The shop and sticker book stay open.' })]));
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Arcade (bonus games)' }), seg([['on', 'On'], ['off', 'Off']], S.settings.arcade || 'on', function (v) { S.settings.arcade = v; save(true); }),
      el('span', { class: 'fine', text: 'She earns a game token each time a game moves up a level and when she opens the daily treasure chest. Each bonus game lasts about a minute and gives no stars.' })]));
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Celebrations' }), seg([['big', 'Big (confetti & stars)'], ['calm', 'Calm']], S.settings.celebrate || 'big', function (v) { S.settings.celebrate = v; save(true); })]));
    set.append(el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Halloween Hollow' }), seg([['auto', 'Oct 1 – Nov 7'], ['on', 'Always'], ['off', 'Hide']], S.settings.halloween || 'auto', function (v) { S.settings.halloween = v; save(true); })]));
    w.append(set);

    /* about */
    var about = el('section', { class: 'panel' });
    about.append(el('h3', { text: 'How the levels line up' }));
    about.append(el('p', { class: 'lede', text: 'Games follow the Illinois Learning Standards for kindergarten (the Common Core codes shown on each skill). “K goal” means what a kindergartner is expected to do by the end of the school year, so in the fall most children are still working toward it. “Ahead of K” means they passed a level taken from first-grade standards (two top levels, counting by 2s and 5s and long spooky words, reach into second grade).' }));
    about.append(el('div', { class: 'legend' }, Object.keys(STATUS).map(function (k) { return el('span', { class: 'chip ' + STATUS[k][1], text: STATUS[k][0] }); })));
    about.append(el('p', { class: 'fine', id: 'sync-line', style: 'margin:12px 0 0', text: syncText() }));
    w.append(about);

    /* reset */
    var rs = el('section', { class: 'panel' });
    rs.append(el('h3', { text: 'Start over' }));
    var area = el('div', { class: 'rowbtns' });
    function idle() {
      area.innerHTML = '';
      area.append(el('button', { class: 'chunk sbtn danger', text: 'Reset all progress', onclick: confirmRow }));
    }
    function confirmRow() {
      area.innerHTML = '';
      area.append(el('span', { text: 'This clears stars, stickers and levels for every game.' }));
      area.append(el('button', { class: 'chunk sbtn danger', text: 'Yes, reset', onclick: function () {
        var keep = { name: S.name, settings: S.settings };
        S = freshState(); S.name = keep.name; S.settings = keep.settings; save(true); renderParents();
      } }));
      area.append(el('button', { class: 'chunk sbtn', text: 'Keep progress', onclick: idle }));
    }
    idle();
    rs.append(area);
    w.append(rs);

    show('parents');
    $('#s-parents').scrollTop = 0;
  }
  function stat(big, small) { return el('div', null, [el('b', { text: big }), el('span', { text: small })]); }
  function seg(optsList, cur, onPick) {
    var s = el('div', { class: 'seg', role: 'group' });
    optsList.forEach(function (o) {
      var b = el('button', { text: o[1], 'aria-pressed': String(o[0] === cur) });
      b.addEventListener('click', function () { Array.prototype.forEach.call(s.children, function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); onPick(o[0]); });
      s.append(b);
    });
    return s;
  }
  function skillRow(g) {
    var row = el('div', { class: 'skill' });
    function draw() {
      row.innerHTML = '';
      var st = gs(g.id), lvl = g.levels[st.level - 1];
      var rec = st.recent, pct = rec.length ? Math.round(rec.reduce(function (a, b) { return a + b; }, 0) / rec.length * 100) : null;
      var stc = STATUS[statusOf(g)];
      row.append(el('div', null, [
        el('div', { class: 'sk-name', text: g.name }),
        el('div', { class: 'sk-std', text: g.std }),
        el('div', { class: 'sk-lvl', text: 'Level ' + st.level + ' of ' + g.levels.length + ': ' + lvl[0] + (lvl[1] === 'beyond' ? ' (1st grade)' : lvl[1] === 'g2' ? ' (2nd grade)' : '') })
      ]));
      row.append(el('div', { class: 'sk-acc' }, pct === null ? [el('span', { class: 'fine', text: 'No answers yet' })] : [
        el('span', { text: pct + '% first try' }), el('span', { class: 'fine', text: ' · last ' + rec.length }),
        el('div', { class: 'acc' }, el('i', { style: 'width:' + pct + '%' }))
      ]));
      var minus = el('button', { class: 'chunk', 'aria-label': 'Lower level', text: '−', onclick: function () { setLevel(-1); } });
      var plus = el('button', { class: 'chunk', 'aria-label': 'Raise level', text: '+', onclick: function () { setLevel(1); } });
      if (st.level <= 1) minus.disabled = true;
      if (st.level >= g.levels.length) plus.disabled = true;
      row.append(el('div', { class: 'sk-right' }, [el('span', { class: 'chip ' + stc[1], text: stc[0] }), el('div', { class: 'stepper' }, [minus, el('span', { text: 'Level ' + st.level }), plus])]));
    }
    function setLevel(d) {
      var st = gs(g.id);
      st.level = Math.min(g.levels.length, Math.max(1, st.level + d)); st.weak = 0;
      save(true); draw();
    }
    draw();
    return row;
  }
  function syncText() {
    return Cloud.on ? 'Progress saves to your Claude account, so it follows you to any device where you’re signed in.' : 'Progress saves in this browser on this device.';
  }

  /* ---------------- wiring ---------------- */
  var App = {
    refresh: function () {
      refreshPips();
      if (current === 'home') renderHome(false);
      else if (current === 'room') renderRoom(roomWorld, false);
      else if (current === 'adv') renderAdventure(false);
      else if (current === 'shop') renderShop(false);
      else if (current === 'arcade') renderArcade(false);
      else if (current === 'parents') renderParents();
    },
    refreshSync: function () { var l = $('#sync-line'); if (l) l.textContent = syncText(); }
  };

  $('#go-btn').addEventListener('click', function () {
    SFX.unlock();
    renderHome(false);
    var name = S.name.trim();
    Voice.say("Hi" + (name ? ' ' + name : '') + "! I'm Pip. Let's play and learn. Pick a room!");
  });
  $('#home-bubble').addEventListener('click', function () { Voice.say($('#home-bubble').textContent); });
  $('#room-read').addEventListener('click', function () { renderRoom('read', true); });
  $('#room-math').addEventListener('click', function () { renderRoom('math', true); });
  $('#room-boo').addEventListener('click', function () { renderRoom('boo', true); });
  $('#mix-btn').addEventListener('click', function () { startRound('mix'); });
  $('#stk-btn').addEventListener('click', renderStickers);
  $('#adv-btn').addEventListener('click', function () { renderAdventure(true); });
  $('#arc-btn').addEventListener('click', function () { renderArcade(true); });
  $('#arc-back').addEventListener('click', function () { renderHome(false); });
  $('#mini-quit').addEventListener('click', function () { if (miniStop) { miniStop(); miniStop = null; } renderArcade(false); });
  $('#shop-btn').addEventListener('click', function () { shopPick = null; renderShop(true); });
  $('#adv-back').addEventListener('click', function () { renderHome(false); });
  $('#shop-back').addEventListener('click', function () { renderHome(false); });
  $('#sleep-stk').addEventListener('click', renderStickers);
  $('#sleep-shop').addEventListener('click', function () { shopPick = null; renderShop(true); });
  $('#sleep-grown').addEventListener('click', openGate);
  $('#stk-back').addEventListener('click', function () { renderHome(true); });
  $('#room-back').addEventListener('click', function () { renderHome(true); });
  $('#grown-btn').addEventListener('click', openGate);
  $('#quit-btn').addEventListener('click', function () {
    if (round && round.res.length) save(true);
    var world = round && !round.mix ? G[round.id].world : null, adv = round && round.adv != null;
    round = null;
    if (adv) renderAdventure(false); else if (world) renderRoom(world, false); else renderHome(false);
  });
  $('#again-btn').addEventListener('click', function () { if (round && round.q) speakQ(round.q); });
  $('#q-text').addEventListener('click', function () { if (round && round.q) speakQ(round.q); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Voice.stop(); if (dirty) Cloud.push(); }
  });

  renderHome(false); show('splash');
  Cloud.init();
})();
</script>
